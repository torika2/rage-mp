<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>მანქანის კონტროლი</title>
<style>
  :root {
    color-scheme: dark;
    --gold: #f2bd4f;
    --text: #f5f3ee;
    --muted: #a9a9aa;
    --pill: rgba(29, 31, 35, .88);
    font-family: "Noto Sans Georgian", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  body { color: var(--text); background: transparent; user-select: none; }
  button { font: inherit; color: inherit; }
  .veil {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 20px;
    background: transparent;
    backdrop-filter: none;
    animation: fade-in .14s ease-out;
  }
  .menu {
    position: relative;
    width: min(560px, 94vw);
    padding: 24px 48px;
    animation: rise-in .16s ease-out;
  }
  .title { margin-bottom: 18px; color: rgba(245, 243, 238, .72); font-size: 11px; text-align: center; }
  .actions {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 38px minmax(0, 1fr);
    grid-template-areas: "engine . lights" ". close ." "belt . doors";
    gap: 10px 8px;
    align-items: center;
  }
  #engineAction { grid-area: engine; }
  #lightsAction { grid-area: lights; }
  #beltAction { grid-area: belt; }
  #doorsAction { grid-area: doors; }
  .action {
    min-height: 46px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 15px;
    border: 1px solid rgba(255, 255, 255, .035);
    border-radius: 999px;
    background: var(--pill);
    cursor: pointer;
    text-align: left;
    transition: background .12s ease, border-color .12s ease, transform .12s ease;
  }
  .action:hover { transform: translateY(-1px); border-color: rgba(242, 189, 79, .5); background: rgba(44, 42, 35, .94); }
  .action:disabled { opacity: .42; cursor: not-allowed; }
  .action:disabled:hover { transform: none; border-color: rgba(255, 255, 255, .035); background: var(--pill); }
  .action:focus-visible, .close:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .icon { width: 20px; flex: none; color: var(--gold); font-size: 15px; text-align: center; }
  .copy { min-width: 0; flex: 1; }
  .label { display: block; font-size: 12px; font-weight: 700; line-height: 1.4; }
  .state { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; }
  .close {
    grid-area: close;
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border: 1px solid rgba(255, 255, 255, .12);
    border-radius: 50%;
    background: rgba(26, 28, 31, .96);
    color: #ddd;
    cursor: pointer;
    font-size: 21px;
    line-height: 1;
  }
  .close:hover { border-color: var(--gold); color: var(--gold); }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes rise-in { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }
  @media (max-width: 520px) {
    .menu { padding: 22px 16px; }
    .actions { grid-template-columns: minmax(0, 1fr) 34px minmax(0, 1fr); gap: 10px 7px; }
    .action { min-height: 48px; padding: 7px 11px; }
    .label { font-size: 11px; }
    .close { width: 34px; height: 34px; }
  }
</style>
</head>
<body>
<div class="veil">
  <main class="menu" aria-label="მანქანის კონტროლი">
    <div class="title">მანქანის კონტროლი</div>
    <div class="actions">
      <button id="engineAction" class="action" type="button">
        <span class="icon" aria-hidden="true">◉</span>
        <span class="copy"><span class="label">ძრავის მართვა</span><span class="state">სტატუსი უცნობია</span></span>
      </button>
      <button id="lightsAction" class="action" type="button">
        <span class="icon" aria-hidden="true">✦</span>
        <span class="copy"><span class="label">ფარების მართვა</span><span class="state">სტატუსი უცნობია</span></span>
      </button>
      <button id="beltAction" class="action" type="button">
        <span class="icon" aria-hidden="true">◇</span>
        <span class="copy"><span class="label">ღვედის მართვა</span><span class="state">სტატუსი უცნობია</span></span>
      </button>
      <button id="doorsAction" class="action" type="button">
        <span class="icon" aria-hidden="true">▣</span>
        <span class="copy"><span class="label">კარების დაკეტვა</span><span class="state">ყველა კარი დაიხურება</span></span>
      </button>
      <button id="closeMenu" class="close" type="button" aria-label="მენიუს დახურვა" title="დახურვა">×</button>
    </div>
  </main>
</div>
<script>
  const RAGE = typeof mp !== 'undefined' && typeof mp.trigger === 'function';
  const stateLabels = {
    engine: document.querySelector('#engineAction .state'),
    lights: document.querySelector('#lightsAction .state'),
    belt: document.querySelector('#beltAction .state')
  };

  window.setVehicleMenuState = state => {
    stateLabels.engine.textContent = state.engine ? 'ძრავა ჩართულია' : 'ძრავა გამორთულია';
    stateLabels.lights.textContent = state.lights === 1
      ? 'ფარები ჩართულია'
      : (state.lights === -1 ? 'ფარები გამორთულია' : 'ფარები ავტომატურ რეჟიმშია');
    const beltAction = document.getElementById('beltAction');
    beltAction.disabled = state.outside === true;
    stateLabels.belt.textContent = state.outside
      ? 'ღვედისთვის მანქანაში ჩაჯექი'
      : (state.belt ? 'ღვედი შეკრულია' : 'ღვედი შეხსნილია');
  };

  document.getElementById('engineAction').onclick = () => { if (RAGE) mp.trigger('vehicle:menu:action', 'engine'); };
  document.getElementById('lightsAction').onclick = () => { if (RAGE) mp.trigger('vehicle:menu:action', 'lights'); };
  document.getElementById('beltAction').onclick = () => { if (RAGE) mp.trigger('vehicle:menu:action', 'belt'); };
  document.getElementById('doorsAction').onclick = () => { if (RAGE) mp.trigger('vehicle:menu:action', 'doors'); };
  document.getElementById('closeMenu').onclick = () => { if (RAGE) mp.trigger('vehicle:menu:close'); };
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && RAGE) {
      event.preventDefault();
      event.stopPropagation();
      mp.trigger('vehicle:menu:close');
    }
  });
  window.onload = () => { if (RAGE) mp.trigger('vehicle:menu:ready'); };
</script>
</body>
</html>
