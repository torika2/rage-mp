<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fuel Station</title>
<style>
  :root {
    --bg: rgba(18, 20, 24, 0.92);
    --panel: rgba(30, 34, 40, 0.9);
    --accent: #ffb42e;
    --accent-dim: #b87d10;
    --text: #eef2f4;
    --muted: #9aa4ad;
    --danger: #ff5b5b;
    --border: rgba(255, 255, 255, 0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: "Segoe UI", Roboto, system-ui, sans-serif; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  #wrap {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: transparent; /* world shows through; only the card is opaque */
  }
  #card {
    width: 560px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 18px; padding: 26px 28px; color: var(--text);
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    animation: pop .18s ease-out;
  }
  @keyframes pop { from { transform: translateY(12px) scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }

  .head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .title { font-size: 22px; font-weight: 700; letter-spacing: .3px; display: flex; align-items: center; gap: 10px; }
  .title .pump { font-size: 24px; }
  .balance { background: var(--panel); border: 1px solid var(--border); padding: 8px 14px; border-radius: 999px;
             font-weight: 700; color: var(--accent); font-size: 15px; }

  .tank { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 18px; }
  .tank .row { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .gauge { height: 12px; background: rgba(255,255,255,0.07); border-radius: 999px; overflow: hidden; }
  .gauge > div { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent-dim), var(--accent)); transition: width .25s; }

  .label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 4px 0 10px; }

  .octanes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 18px; }
  .oct { background: var(--panel); border: 2px solid var(--border); border-radius: 12px; padding: 11px 6px; cursor: pointer;
         text-align: center; transition: border-color .15s, transform .1s; }
  .oct:hover { transform: translateY(-2px); }
  .oct.sel { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255,180,46,0.15) inset; }
  .oct .nm { font-weight: 700; font-size: 13px; }
  .oct .pr { color: var(--accent); font-weight: 700; margin-top: 4px; font-size: 14px; }
  .oct .tag { color: var(--muted); font-size: 10px; margin-top: 4px; }

  .amount { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 18px; }
  .amount .top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
  .amount .liters { font-size: 30px; font-weight: 800; }
  .amount .liters small { font-size: 15px; color: var(--muted); font-weight: 600; }
  .amount .cost { font-size: 20px; font-weight: 800; color: var(--accent); }
  input[type=range] { width: 100%; accent-color: var(--accent); height: 6px; cursor: pointer; }
  .chips { display: flex; gap: 8px; margin-top: 12px; }
  .chip { flex: 1; background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 8px;
          padding: 8px 0; text-align: center; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .15s; }
  .chip:hover { background: rgba(255,255,255,0.12); }

  .drain { display: flex; align-items: center; gap: 11px; margin-bottom: 14px; cursor: pointer; }
  .sw { width: 40px; height: 22px; border-radius: 999px; background: rgba(255,255,255,0.14);
        position: relative; transition: background .15s; flex: none; }
  .sw i { position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%;
          background: #fff; transition: left .15s; }
  .sw.on { background: var(--accent); }
  .sw.on i { left: 21px; }
  .dtxt { font-size: 13px; font-weight: 600; line-height: 1.2; }
  .dtxt small { display: block; color: var(--muted); font-size: 11px; font-weight: 500; }

  .actions { display: flex; gap: 12px; }
  .btn { flex: 1; border: none; border-radius: 10px; padding: 14px 0; font-size: 15px; font-weight: 700; cursor: pointer; transition: filter .15s, opacity .15s; }
  .btn.cancel { background: rgba(255,255,255,0.08); color: var(--text); }
  .btn.buy { background: var(--accent); color: #2a1c00; }
  .btn.buy:disabled { opacity: .4; cursor: not-allowed; }
  .btn:hover:not(:disabled) { filter: brightness(1.08); }
  .hint { text-align: center; color: var(--muted); font-size: 11px; margin-top: 12px; }

  #toast { position: absolute; top: 24px; left: 50%; transform: translateX(-50%) translateY(-20px);
           background: var(--panel); border: 1px solid var(--border); color: var(--text);
           padding: 12px 20px; border-radius: 10px; font-weight: 600; opacity: 0; transition: all .25s; pointer-events: none; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.ok { border-color: var(--accent); }
  #toast.err { border-color: var(--danger); color: #ffd4d4; }
</style>
</head>
<body>
  <div id="wrap">
    <div id="card">
      <div class="head">
        <div class="title"><span class="pump">⛽</span> საწვავის სადგური</div>
        <div class="balance" id="balance">$0</div>
      </div>

      <div class="tank">
        <div class="row"><span>ავზი</span><span id="tankTxt">0%</span></div>
        <div class="gauge"><div id="tankBar"></div></div>
      </div>

      <div class="label">აირჩიე საწვავი</div>
      <div class="octanes" id="octanes"></div>

      <div class="label">რაოდენობა</div>
      <div class="amount">
        <div class="drain" id="drainRow">
          <div class="sw" id="drainSw"><i></i></div>
          <div class="dtxt">ჯერ დაცალე ავზი<small id="drainNote"></small></div>
        </div>
        <div class="top">
          <div class="liters"><span id="litersVal">0</span><small> ლ</small></div>
          <div class="cost" id="costVal">$0</div>
        </div>
        <input type="range" id="slider" min="0" max="0" value="0" step="1" />
        <div class="chips">
          <div class="chip" data-q="25">25%</div>
          <div class="chip" data-q="50">50%</div>
          <div class="chip" data-q="100">სავსემდე</div>
        </div>
      </div>

      <div class="actions">
        <button class="btn cancel" id="cancelBtn">გაუქმება</button>
        <button class="btn buy" id="buyBtn">ყიდვა — $0</button>
      </div>
      <div class="hint">აირჩიე დაწკაპუნებით • Esc — გაუქმება • Enter — ყიდვა</div>
    </div>
  </div>
  <div id="toast"></div>

<script>
  const RAGE = (typeof mp !== 'undefined');
  const TAGS = ['ყველაზე იაფი', 'დაბალანსებული', 'მეტი სიმძლავრე', 'მაქს. სიმძლავრე'];

  let data = { money: 0, fuelPct: 0, tankLiters: 65, octanes: [] };
  let sel = 1;          // selected octane index
  let liters = 0;
  let drainFirst = false; // empty tank before filling

  const $ = id => document.getElementById(id);

  function spaceLiters() {
    return drainFirst ? Math.floor(data.tankLiters)
                      : Math.floor((100 - data.fuelPct) / 100 * data.tankLiters);
  }
  function priceOf(i) { return data.octanes[i] ? data.octanes[i].price : 0; }
  function maxLiters() {
    const afford = Math.floor(data.money / (priceOf(sel) || 1));
    return Math.max(0, Math.min(spaceLiters(), afford));
  }
  function cost() { return Math.ceil(liters * priceOf(sel)); }

  function renderOctanes() {
    const c = $('octanes'); c.innerHTML = '';
    data.octanes.forEach((o, i) => {
      const d = document.createElement('div');
      d.className = 'oct' + (i === sel ? ' sel' : '');
      d.innerHTML = `<div class="nm">${o.name}</div><div class="pr">$${o.price.toFixed(2)}/L</div><div class="tag">${TAGS[i] || ''}</div>`;
      d.onclick = () => { sel = i; clamp(); render(); };
      c.appendChild(d);
    });
  }
  function clamp() { liters = Math.max(0, Math.min(liters, maxLiters())); }
  function render() {
    $('balance').textContent = '$' + data.money.toLocaleString();
    $('tankTxt').textContent = data.fuelPct + '%';
    $('tankBar').style.width = data.fuelPct + '%';
    document.querySelectorAll('.oct').forEach((el, i) => el.classList.toggle('sel', i === sel));
    const mx = maxLiters();
    const s = $('slider'); s.max = mx; s.value = liters;
    $('litersVal').textContent = liters;
    $('costVal').textContent = '$' + cost();
    const buy = $('buyBtn');
    buy.textContent = 'ყიდვა — $' + cost();
    buy.disabled = liters <= 0;
    // drain toggle visuals
    $('drainSw').className = 'sw' + (drainFirst ? ' on' : '');
    $('drainNote').textContent = drainFirst
      ? (data.fuelPct > 0 ? 'გადაყრის მიმდინარე ' + data.fuelPct + '%-ს და ჩაასხამს სუფთას' : 'ავზი უკვე ცარიელია')
      : 'შეერევა არსებულ საწვავს';
  }

  // called from the client
  window.setFuelData = function (d) {
    data = d; if (sel >= data.octanes.length) sel = 0;
    renderOctanes(); clamp(); render();
  };
  window.fuelToast = function (msg, ok) {
    const t = $('toast'); t.textContent = msg; t.className = 'show ' + (ok ? 'ok' : 'err');
    setTimeout(() => { t.className = ''; }, 2200);
  };

  $('slider').oninput = e => { liters = parseInt(e.target.value) || 0; render(); };
  document.querySelectorAll('.chip').forEach(ch => ch.onclick = () => {
    const q = parseInt(ch.dataset.q);
    liters = Math.min(Math.round(spaceLiters() * q / 100), maxLiters());
    render();
  });
  $('drainRow').onclick = () => { drainFirst = !drainFirst; clamp(); render(); };
  $('cancelBtn').onclick = () => { if (RAGE) mp.trigger('fuel:close'); };
  $('buyBtn').onclick = () => { if (liters > 0 && RAGE) mp.trigger('fuel:purchase', sel, liters, drainFirst); };
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && RAGE) {
      e.preventDefault();
      e.stopPropagation();
      mp.trigger('fuel:close');
    }
    if (e.key === 'Enter' && liters > 0 && RAGE) mp.trigger('fuel:purchase', sel, liters, drainFirst);
  });

  // ask the client for data once the page is up
  window.onload = () => { if (RAGE) mp.trigger('fuel:uiReady'); else window.setFuelData({ money: 4200, fuelPct: 35, tankLiters: 65, octanes: [{name:'Regular 87',price:2.3},{name:'Plus 91',price:3.0},{name:'Premium 98',price:4.2},{name:'Super 100',price:5.5}] }); };
</script>
</body>
</html>
