<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ავტოსალონი</title>
<style>
  :root {
    color-scheme: dark;
    --gold: #f2c15c; --blue: #5ac8fa; --green: #8ed17a; --red: #ff6b6b;
    --text: #f3f0e8; --muted: #aaa79e; --line: rgba(255,255,255,.12);
    font-family: "Noto Sans Georgian", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { width:100%; height:100%; margin:0; overflow:hidden; }
  body { color: var(--text); user-select:none; background: transparent; display:flex; align-items:center; justify-content:center; }
  .panel { width: min(560px, 92vw); max-height: 86vh; background: linear-gradient(180deg,#101822,#0c0f13);
    border:1px solid rgba(90,200,250,.45); border-radius:14px; box-shadow:0 24px 70px rgba(0,0,0,.6); display:flex; flex-direction:column; overflow:hidden; }
  .head { display:flex; align-items:center; gap:10px; padding:16px 20px; border-bottom:1px solid var(--line); }
  .head h1 { margin:0; font-size:18px; font-weight:800; }
  .head .spacer { flex:1; }
  .money { color: var(--gold); font-weight:800; font-variant-numeric: tabular-nums; }
  .close { width:32px; height:32px; border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--muted); border-radius:8px; font-size:17px; cursor:pointer; }
  .close:hover { color: var(--blue); border-color: var(--blue); }
  .msg { min-height:16px; padding:0 20px; margin-top:10px; font-size:12px; color: var(--red); }
  .msg.ok { color: var(--green); }
  .list { overflow-y:auto; padding:12px 16px 18px; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .list::-webkit-scrollbar { width:8px; } .list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius:4px; }
  .car { border:1px solid var(--line); border-radius:11px; background:rgba(255,255,255,.03); padding:13px 14px; display:flex; flex-direction:column; gap:9px; }
  .car .name { font-weight:700; font-size:14px; }
  .car .price { color: var(--gold); font-variant-numeric: tabular-nums; font-size:13px; }
  .buy { margin-top:2px; padding:9px; border:0; border-radius:8px; cursor:pointer; font-weight:800; font-size:13px; color:#0b0f13; background:linear-gradient(180deg,var(--green),#6bb45a); }
  .buy:hover { filter:brightness(1.05); }
  .buy:disabled { opacity:.45; cursor:default; background:linear-gradient(180deg,#5a6168,#474c52); color:#cfd3d8; }
</style>
</head>
<body>
  <div class="panel">
    <div class="head">
      <h1>ავტოსალონი</h1>
      <div class="spacer"></div>
      <div class="money" id="money">$0</div>
      <button class="close" id="close">×</button>
    </div>
    <div class="msg" id="msg"></div>
    <div class="list" id="list"></div>
  </div>
<script>
  const RAGE = typeof mp !== 'undefined' && typeof mp.trigger === 'function';
  const trigger = (name, ...args) => { if (RAGE) mp.trigger(name, ...args); };
  const $ = (id) => document.getElementById(id);

  let money = 0;
  const fmt = (n) => '$' + Number(n || 0).toLocaleString('en-US');

  window.setCarshop = function (data) {
    money = Number(data.money) || 0;
    $('money').textContent = fmt(money);
    const list = $('list');
    list.innerHTML = '';
    (data.cars || []).forEach(car => {
      const el = document.createElement('div'); el.className = 'car';
      const afford = money >= car.price;
      el.innerHTML = '<div class="name">' + car.label + '</div><div class="price">' + fmt(car.price) + '</div>';
      const b = document.createElement('button');
      b.className = 'buy'; b.textContent = afford ? 'ყიდვა' : 'არ გყოფნის';
      b.disabled = !afford;
      b.onclick = () => { b.disabled = true; trigger('carshop:buy', car.key); };
      el.appendChild(b);
      list.appendChild(el);
    });
  };
  window.carshopResult = function (res) {
    const m = $('msg');
    m.textContent = res.msg || '';
    m.className = 'msg' + (res.ok ? ' ok' : '');
    if (typeof res.money === 'number') { money = res.money; $('money').textContent = fmt(money); }
    trigger('carshop:uiReady'); // refresh affordability after a purchase
  };

  $('close').addEventListener('click', () => trigger('carshop:close'));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') trigger('carshop:close'); });

  if (RAGE) trigger('carshop:uiReady');
  else window.setCarshop({ money: 100000, cars: [{ key: 'm8', label: 'BMW M8 Competition', price: 150000 }, { key: 'yumi', label: 'Yumi', price: 50000 }] });
</script>
</body>
</html>
