<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8" />
<title>Death</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", Roboto, system-ui, sans-serif; }
  html, body { width: 100%; height: 100%; overflow: hidden; user-select: none; }

  /* Dark vignette that fades in over the 5s blur ramp so the screen settles into the timeout view. */
  #overlay {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.55) 0%, rgba(0,0,0,0.9) 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: #eef2f4; text-align: center;
    opacity: 0; transition: opacity 5s ease;
  }
  #overlay.shown { opacity: 1; }

  #title {
    font-size: 46px; font-weight: 800; letter-spacing: 1px;
    color: #ff5b5b; text-shadow: 0 4px 24px rgba(0,0,0,.8);
  }
  #timer {
    margin-top: 18px; font-size: 80px; font-weight: 800; line-height: 1;
    font-variant-numeric: tabular-nums; text-shadow: 0 4px 24px rgba(0,0,0,.8);
  }
  #hint {
    margin-top: 22px; font-size: 20px; font-weight: 600; color: #cfd6db; max-width: 640px;
    text-shadow: 0 2px 12px rgba(0,0,0,.8);
  }
  #hint.wait { color: #9aa4ad; }
</style>
</head>
<body>
  <div id="overlay">
    <div id="title">თქვენ გარდაიცვალეთ</div>
    <div id="timer">2:18</div>
    <div id="hint">მედიკოსს შეუძლია თქვენი გაცოცხლება 30 წამის განმავლობაში.</div>
  </div>

  <script>
    var overlay = document.getElementById('overlay');
    var timerEl = document.getElementById('timer');
    var hintEl  = document.getElementById('hint');

    // Fade the vignette in on the next frame so the CSS transition runs (matches the 5s blur).
    requestAnimationFrame(function () { overlay.classList.add('shown'); });

    // Called by the client every ~0.5s: secondsLeft until respawn, canRevive = inside the 30s window.
    window.setDeath = function (secondsLeft, canRevive) {
      var total = Math.max(0, parseInt(secondsLeft, 10) || 0);
      var minutes = Math.floor(total / 60);
      var seconds = total % 60;
      timerEl.textContent = minutes + ':' + (seconds < 10 ? '0' : '') + seconds;

      if (canRevive) {
        hintEl.className = '';
        hintEl.textContent = 'მედიკოსს შეუძლია თქვენი გაცოცხლება 30 წამის განმავლობაში.';
      } else {
        hintEl.className = 'wait';
        hintEl.textContent = 'ელოდებით საავადმყოფოში გადაყვანას...';
      }
    };
  </script>
</body>
</html>
