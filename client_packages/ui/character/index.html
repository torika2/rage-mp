<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8" />
<title>Character</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", Roboto, system-ui, sans-serif; }
  html, body { width: 100%; height: 100%; overflow: hidden; user-select: none; }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 34px;
    background: radial-gradient(ellipse at center, rgba(10,12,16,.82) 0%, rgba(6,7,10,.96) 100%);
    color: #eef2f4;
  }
  h1 { font-size: 30px; font-weight: 800; letter-spacing: .5px; text-shadow: 0 4px 20px rgba(0,0,0,.7); }
  .sub { font-size: 14px; color: #9aa4ad; margin-top: -22px; }
  .cards { display: flex; gap: 26px; }
  .card {
    width: 220px; height: 280px; border-radius: 18px; cursor: pointer;
    background: linear-gradient(160deg, rgba(30,34,42,.95), rgba(16,18,23,.95));
    border: 2px solid rgba(255,255,255,.1); box-shadow: 0 16px 44px rgba(0,0,0,.55);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
    transition: transform .15s, border-color .15s, box-shadow .15s;
  }
  .card:hover { transform: translateY(-6px); border-color: var(--c); box-shadow: 0 20px 52px rgba(0,0,0,.65); }
  .card .emoji { font-size: 92px; line-height: 1; }
  .card .label { font-size: 22px; font-weight: 800; }
  .card .en { font-size: 12px; color: #9aa4ad; font-weight: 600; letter-spacing: 1px; }
  #male { --c: #5aa9ff; } #male:hover .label { color: #5aa9ff; }
  #female { --c: #ff7ac2; } #female:hover .label { color: #ff7ac2; }
</style>
</head>
<body>
  <div id="overlay">
    <h1>აირჩიე პერსონაჟი</h1>
    <div class="sub">არჩევანი ინახება ანგარიშზე</div>
    <div class="cards">
      <div class="card" id="male"><div class="emoji">👨</div><div class="label">კაცი</div><div class="en">MALE</div></div>
      <div class="card" id="female"><div class="emoji">👩</div><div class="label">ქალი</div><div class="en">FEMALE</div></div>
    </div>
  </div>
  <script>
    var picked = false;
    function pick(g) {
      if (picked) return; picked = true;
      if (typeof mp !== 'undefined') mp.trigger('character:pick', g);
    }
    document.getElementById('male').onclick = function () { pick('m'); };
    document.getElementById('female').onclick = function () { pick('f'); };
  </script>
</body>
</html>
