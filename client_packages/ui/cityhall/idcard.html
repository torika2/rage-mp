<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>პირადობის მოწმობა</title>
<style>
  :root { color-scheme: dark; font-family: "Noto Sans Georgian", "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: transparent; pointer-events: none; user-select: none; }
  /* Passive overlay (no cursor): bottom-right, above the HUD. */
  .card { position: absolute; right: 28px; bottom: 150px; width: 380px; padding: 16px 18px; border-radius: 14px; color: #eef3f9;
    background: linear-gradient(135deg, #1d3552, #10202f); border: 1px solid rgba(120, 180, 240, .55); box-shadow: 0 18px 40px rgba(0, 0, 0, .5);
    animation: slide .25s ease-out; }
  .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .top b { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #9fc7ef; }
  .top span { color: #f2c15c; font-weight: 700; letter-spacing: .08em; font-size: 13px; }
  .grid { display: grid; grid-template-columns: 84px 1fr 1fr; gap: 8px 14px; font-size: 13px; }
  .photo { grid-row: span 3; width: 84px; height: 104px; border-radius: 8px; background: rgba(255, 255, 255, .08); display: grid; place-items: center; font-size: 40px; }
  .lics { margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(120, 180, 240, .25); font-size: 11px; line-height: 1.5; color: #cfe0f3; }
  small { display: block; color: #9fb7d3; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; }
  @keyframes slide { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>
<div class="card" id="card"></div>
<script>
  // Card data arrives in the URL hash (JSON), set by the client when someone shows their ID.
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);
  let card = { number: 'GE-000012', first: 'Giorgi', last: 'Beridze', dob: '1996-04-12', sex: 'M', issued: '2026-09-30' };
  try { if (location.hash.length > 1) card = JSON.parse(decodeURIComponent(location.hash.slice(1))); } catch (e) {}
  document.getElementById('card').innerHTML =
    '<div class="top"><b>საქართველო · პირადობის მოწმობა</b><span>' + esc(card.number) + '</span></div>' +
    '<div class="grid"><div class="photo">' + (card.sex === 'F' ? '👩' : '👨') + '</div>' +
      '<div><small>სახელი</small>' + esc(card.first) + '</div><div><small>გვარი</small>' + esc(card.last) + '</div>' +
      '<div><small>დაბადების თარიღი</small>' + esc(card.dob) + '</div><div><small>სქესი</small>' + (card.sex === 'F' ? 'მდედრ.' : 'მამრ.') + '</div>' +
      '<div><small>გაცემულია</small>' + esc(card.issued) + '</div><div><small>გამცემი</small>მერია</div></div>' +
    '<div class="lics"><small>ლიცენზიები</small>' + ((card.licenses && card.licenses.length) ? card.licenses.map(esc).join(' · ') : '—') + '</div>';
</script>
</body>
</html>
