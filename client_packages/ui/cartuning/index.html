<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ავტოტუნინგი</title>
<style>
  :root {
    color-scheme: dark;
    --gold:#f2c15c; --gold-soft:rgba(242,193,92,.48); --accent:#5ac8fa; --green:#8ed17a;
    --text:#f3f0e8; --muted:#aaa79e; --line:rgba(255,255,255,.12);
    --panel:linear-gradient(180deg,#131518,#0e1012);
    font-family:"Noto Sans Georgian","Segoe UI",sans-serif;
  }
  * { box-sizing:border-box; }
  html,body { width:100%; height:100%; margin:0; overflow:hidden; }
  body { color:var(--text); background:transparent; user-select:none; }
  button { color:inherit; font:inherit; cursor:pointer; }
  .veil { position:absolute; inset:0; display:flex; justify-content:flex-end; animation:appear .18s ease-out; }
  .shop { width:min(760px,46vw); height:100%; display:grid; grid-template-rows:62px minmax(0,1fr) auto; background:var(--panel); border-left:1px solid var(--gold-soft); box-shadow:-18px 0 40px rgba(0,0,0,.45); animation:slide .22s ease-out; }
  .head { display:flex; align-items:center; gap:14px; padding:0 22px; border-bottom:1px solid var(--line); }
  .title { display:flex; flex-direction:column; }
  .title h1 { margin:0; font-size:16px; font-weight:700; }
  .title span { color:var(--muted); font-size:11px; }
  .spacer { flex:1; }
  .money { color:var(--gold); font-size:15px; font-weight:700; font-variant-numeric:tabular-nums; }
  .close { width:34px; height:34px; border:1px solid var(--line); background:rgba(255,255,255,.04); color:var(--muted); font-size:18px; border-radius:8px; }
  .close:hover { color:var(--gold); border-color:var(--gold-soft); }
  .body { min-height:0; display:grid; grid-template-columns:minmax(180px,.75fr) minmax(300px,1.25fr); }
  .cats { overflow:auto; padding:14px; border-right:1px solid var(--line); display:flex; flex-direction:column; gap:6px; }
  .cat { display:flex; align-items:center; gap:10px; padding:11px 13px; border:1px solid transparent; border-radius:10px; background:rgba(255,255,255,.03); color:var(--text); font-size:13px; font-weight:600; text-align:left; }
  .cat:hover { background:rgba(255,255,255,.06); }
  .cat.on { border-color:var(--gold-soft); background:rgba(242,193,92,.1); color:var(--gold); }
  .detail { overflow:auto; padding:18px 20px; display:flex; flex-direction:column; gap:18px; }
  .picker { display:grid; gap:9px; }
  .picker-label { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.06em; display:flex; justify-content:space-between; }
  .picker-label b { color:var(--gold); font-weight:700; }
  .styles { display:flex; flex-direction:column; gap:5px; }
  .style { display:flex; align-items:center; gap:8px; padding:10px 12px; border:1px solid transparent; border-radius:8px; background:rgba(255,255,255,.03); font-size:13px; text-align:left; }
  .style:hover { background:rgba(255,255,255,.06); }
  .style.on { border-color:var(--gold-soft); background:rgba(242,193,92,.1); color:var(--gold); }
  .style.cart { border-color:rgba(142,209,122,.5); background:rgba(142,209,122,.12); color:var(--green); }
  .style .tag { margin-left:auto; font-size:11px; color:var(--muted); }
  .style.on .tag { color:var(--gold); } .style.cart .tag { color:var(--green); }
  .style.none { opacity:.4; cursor:default; }
  .chanrow { display:flex; gap:6px; flex-wrap:wrap; }
  .tagbtn { padding:8px 12px; border:1px solid var(--line); border-radius:999px; background:rgba(255,255,255,.04); font-size:12px; }
  .tagbtn:hover { border-color:var(--gold-soft); }
  .tagbtn.on { border-color:var(--gold); background:rgba(242,193,92,.14); color:var(--gold); }
  .tagbtn small { color:var(--gold); margin-left:5px; }
  .swatches { display:flex; flex-wrap:wrap; gap:8px; }
  .swatch { width:30px; height:30px; padding:0; border-radius:50%; border:2px solid rgba(255,255,255,.12); }
  .swatch:hover { border-color:var(--gold-soft); }
  .swatch.on { border-color:#fff; box-shadow:0 0 0 2px var(--gold-soft); }
  .swatch.cart { border-color:var(--green); box-shadow:0 0 0 2px rgba(142,209,122,.5); }
  /* engine cards (direct buy) */
  .eng { display:flex; flex-direction:column; gap:7px; padding:13px 14px; border:1px solid var(--line); border-radius:11px; background:rgba(255,255,255,.03); }
  .eng .nm { font-weight:700; font-size:14px; } .eng .sub { font-size:11px; color:var(--muted); }
  .pips { display:flex; gap:4px; } .pip { flex:1; height:7px; border-radius:4px; background:rgba(255,255,255,.1); } .pip.on { background:var(--gold); }
  .buy { margin-top:3px; padding:9px; border:0; border-radius:8px; font-weight:800; font-size:13px; color:#0b0f13; background:linear-gradient(180deg,var(--green),#6bb45a); }
  .buy:hover { filter:brightness(1.05); } .buy:disabled { opacity:.45; cursor:default; background:linear-gradient(180deg,#5a6168,#474c52); color:#cfd3d8; }
  /* cart footer */
  .cart { border-top:1px solid var(--gold-soft); padding:14px 18px; display:flex; flex-direction:column; gap:10px; background:rgba(0,0,0,.25); }
  .cart-head { font-size:12px; color:var(--muted); } .cart-head b { color:var(--accent); }
  .cart-list { max-height:140px; overflow:auto; display:flex; flex-direction:column; gap:5px; }
  .cart-empty { color:var(--muted); font-size:12px; padding:4px 0; }
  .cart-item { display:flex; align-items:center; gap:8px; padding:7px 10px; border:1px solid var(--line); border-radius:8px; background:rgba(255,255,255,.03); font-size:12px; }
  .cart-item .ci-price { margin-left:auto; color:var(--gold); font-variant-numeric:tabular-nums; }
  .cart-item .ci-del { width:22px; height:22px; border:1px solid var(--line); border-radius:6px; background:transparent; color:var(--muted); font-size:13px; line-height:1; }
  .cart-item .ci-del:hover { border-color:#ff6978; color:#ff6978; }
  .checkout { display:grid; grid-template-columns:1fr auto; align-items:center; gap:12px; }
  .checkout .total { font-size:13px; color:var(--muted); } .checkout .total b { color:var(--gold); font-size:18px; font-variant-numeric:tabular-nums; }
  .checkout button { padding:12px 22px; border:1px solid var(--gold); border-radius:10px; background:rgba(242,193,92,.16); color:var(--gold); font-weight:700; font-size:14px; }
  .checkout button:hover { background:rgba(242,193,92,.28); } .checkout button:disabled { opacity:.4; cursor:not-allowed; }
  .msg { font-size:12px; color:#ff6978; min-height:15px; } .msg.ok { color:var(--green); }
  @keyframes appear { from { opacity:0; } to { opacity:1; } }
  @keyframes slide { from { transform:translateX(24px); opacity:.4; } to { transform:none; opacity:1; } }
</style>
</head>
<body>
<div class="veil">
  <main class="shop">
    <header class="head">
      <div class="title"><h1>ავტოტუნინგი</h1><span id="carName">—</span></div>
      <div class="spacer"></div>
      <div class="money" id="money">$0</div>
      <button class="close" id="close" title="დახურვა (Esc)">×</button>
    </header>
    <div class="body">
      <div class="cats" id="cats"></div>
      <div class="detail" id="detail"></div>
    </div>
    <div class="cart" id="cartFooter">
      <div class="msg" id="msg"></div>
      <div class="cart-head">კალათა · <b id="cartCount">0</b> ცვლილება</div>
      <div class="cart-list" id="cartList"><div class="cart-empty">კალათა ცარიელია</div></div>
      <div class="checkout">
        <div class="total">სულ: <b id="cartTotal">$0</b></div>
        <button id="checkout" disabled>გადახდა</button>
      </div>
    </div>
  </main>
</div>
<script>
  const RAGE = typeof mp !== 'undefined' && typeof mp.trigger === 'function';
  const trigger = (n, ...a) => { if (RAGE) mp.trigger(n, ...a); };
  const $ = (id) => document.getElementById(id);
  const fmt = (n) => '$' + Number(n || 0).toLocaleString('en-US');
  const esc = (s) => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

  const CATS = [['engine', 'შესაძლებლობები'], ['colors', 'ფერი'], ['wheels', 'დისკები'], ['body', 'კუზაო'], ['extras', 'დამატებითი']];
  const WHEEL_TYPES = ['Sport', 'Muscle', 'Lowrider', 'SUV', 'Offroad', 'Tuner', 'Bike', 'High End', "Benny's", "Benny's Bespoke", 'Open Wheel', 'Street', 'Track'];
  const TINTS = ['არა', 'შავი', 'მუქი', 'ღია', 'ქარხნული', 'მწვანე', 'ლიმუზინი'];
  const BODY = [['0', 'სპოილერი'], ['1', 'წინა ბამპერი'], ['2', 'უკანა ბამპერი'], ['3', 'გვერდითი ზღუდარი']];
  const EXTRAS = [['4', 'გამონაბოლქვი'], ['7', 'კაპოტი'], ['10', 'სახურავი']];
  const CAT_LABEL = {
    primary: 'ძირითადი ფერი', secondary: 'მეორადი ფერი', pearl: 'პერლამუტრი', wheel: 'დისკების ფერი',
    windowTint: 'ტონირება', wheelType: 'დისკის ტიპი',
    'mod:0': 'სპოილერი', 'mod:1': 'წინა ბამპერი', 'mod:2': 'უკანა ბამპერი', 'mod:3': 'გვერდითი ზღუდარი',
    'mod:4': 'გამონაბოლქვი', 'mod:7': 'კაპოტი', 'mod:10': 'სახურავი', 'mod:23': 'დისკის დიზაინი'
  };
  const PALETTE = [
    [0,'#0f1115'],[1,'#1e2024'],[2,'#272a2e'],[3,'#33373c'],[4,'#5b5f66'],[5,'#9a9ea3'],[6,'#73777b'],[8,'#b9b9b9'],[9,'#51565a'],[111,'#ffffff'],[157,'#b0a99a'],[158,'#1f1f22'],
    [27,'#f26f1f'],[11,'#c00e1a'],[12,'#d71e20'],[14,'#a0282c'],[17,'#7e1a1f'],[22,'#db1b2a'],[88,'#f6d84a'],[89,'#fbe70f'],[99,'#d9a40e'],[90,'#b89b5e'],[38,'#5e3f27'],[96,'#4a4636'],
    [49,'#13263a'],[64,'#304b73'],[70,'#0a86c9'],[73,'#6ea6d8'],[83,'#8fb6d4'],[68,'#2a5d8c'],[146,'#3b1a63'],[145,'#6b1f7d'],[135,'#c42e6f'],[137,'#f3a9c8'],[134,'#cabfa8'],[128,'#653f23'],
    [53,'#13402f'],[55,'#1a6b3d'],[51,'#2d4a30'],[151,'#436b36'],[92,'#355f2c']
  ];

  let state = { parts: [], money: 0, car: '', visual: { colors: {}, mods: {} }, visualPrices: {}, options: { mods: {}, wheelTypes: 13, windowTints: 7 } };
  let cat = 'engine', colorChannel = 'primary';
  let cart = {}; // staged visual changes: category -> value

  window.setTuning = (data) => {
    try { const d = (typeof data === 'string') ? JSON.parse(data) : data; state = Object.assign(state, d); } catch (e) { return; }
    state.visual = state.visual || {}; state.visual.colors = state.visual.colors || {}; state.visual.mods = state.visual.mods || {};
    state.options = state.options || { mods: {}, wheelTypes: 13, windowTints: 7 };
    $('carName').textContent = state.car || '';
    $('money').textContent = fmt(state.money);
    renderCats(); renderDetail(); renderCart();
  };
  window.tuningResult = (res) => {
    let r; try { r = (typeof res === 'string') ? JSON.parse(res) : res; } catch (e) { return; }
    const m = $('msg'); m.textContent = r.msg || ''; m.className = 'msg' + (r.ok ? ' ok' : '');
    if (r.checkout && r.ok) { cart = {}; renderDetail(); renderCart(); }
  };

  const price = (c) => state.visualPrices[c] || 0;
  const modCur = (type) => (state.visual.mods[type] != null) ? state.visual.mods[type] : -1;
  function savedVal(c) {
    if (c.indexOf('mod:') === 0) return modCur(c.slice(4));
    if (c === 'windowTint') return (state.visual.windowTint != null ? state.visual.windowTint : 0);
    if (c === 'wheelType') return (state.visual.wheelType != null ? state.visual.wheelType : -1);
    return state.visual.colors[c];
  }
  const effVal = (c) => (c in cart) ? cart[c] : savedVal(c);

  function previewConfig() {
    const v = JSON.parse(JSON.stringify(state.visual || {}));
    v.colors = v.colors || {}; v.mods = v.mods || {};
    for (const c in cart) {
      const val = cart[c];
      if (c === 'primary' || c === 'secondary' || c === 'pearl' || c === 'wheel') v.colors[c] = val;
      else if (c === 'windowTint') v.windowTint = val;
      else if (c === 'wheelType') v.wheelType = val;
      else if (c.indexOf('mod:') === 0) v.mods[c.slice(4)] = val;
    }
    if (v.colors.primary != null && v.colors.secondary == null) v.colors.secondary = v.colors.primary;
    if (v.colors.secondary != null && v.colors.primary == null) v.colors.primary = v.colors.secondary;
    return v;
  }
  function stage(c, val) {
    if (val === savedVal(c)) delete cart[c]; else cart[c] = val;
    trigger('cartuning:preview', JSON.stringify(previewConfig()));
    renderDetail(); renderCart();
  }

  function renderCats() {
    $('cats').innerHTML = CATS.map(c => '<button class="cat' + (cat === c[0] ? ' on' : '') + '" data-tab="' + c[0] + '">' + esc(c[1]) + '</button>').join('');
    $('cartFooter').style.display = (cat === 'engine') ? 'none' : '';
  }

  // one selectable option row
  function row(label, c, val) {
    const staged = (c in cart) && cart[c] === val;
    const on = !staged && effVal(c) === val;
    const tag = staged ? 'კალათაში' : (on ? 'არჩეული' : fmt(price(c)));
    return '<button class="style' + (staged ? ' cart' : (on ? ' on' : '')) + '" data-cat="' + c + '" data-val="' + val + '"><span>' + esc(label) + '</span><span class="tag">' + tag + '</span></button>';
  }
  function modPicker(type, label) {
    const count = (state.options.mods && state.options.mods[type]) || 0;
    let rows = row('სტოკი', 'mod:' + type, -1);
    for (let i = 0; i < count; i++) rows += row('ვარიანტი ' + (i + 1), 'mod:' + type, i);
    if (count === 0) rows += '<div class="style none"><span>სხვა ვარიანტი არ არის</span></div>';
    return '<div class="picker"><div class="picker-label"><span>' + esc(label) + '</span><b>' + fmt(price('mod:' + type)) + ' / ცვლილება</b></div><div class="styles">' + rows + '</div></div>';
  }
  function listPicker(c, label, names) {
    let rows = '';
    for (let i = 0; i < names.length; i++) rows += row(names[i], c, i);
    return '<div class="picker"><div class="picker-label"><span>' + esc(label) + '</span><b>' + fmt(price(c)) + ' / ცვლილება</b></div><div class="styles">' + rows + '</div></div>';
  }

  function renderDetail() {
    const host = $('detail');
    if (cat === 'engine') {
      host.innerHTML = (state.parts || []).map(p => {
        const pips = Array.from({ length: p.max }, (_, i) => '<span class="pip' + (i < p.level ? ' on' : '') + '"></span>').join('');
        const btn = p.atMax ? '<button class="buy" disabled>მაქსიმუმი</button>'
          : '<button class="buy" data-perf="' + esc(p.key) + '"' + (p.canAfford ? '' : ' disabled') + '>' + fmt(p.nextPrice) + '</button>';
        return '<div class="eng"><div class="nm">' + esc(p.label) + '</div><div class="sub">' + esc(p.effect) + ' · დონე ' + p.level + '/' + p.max + '</div><div class="pips">' + pips + '</div>' + btn + '</div>';
      }).join('');
    } else if (cat === 'colors') {
      const chans = [['primary', 'ძირითადი'], ['secondary', 'მეორადი'], ['pearl', 'პერლამუტრი'], ['wheel', 'დისკები']];
      const cur = effVal(colorChannel);
      host.innerHTML =
        '<div class="picker"><div class="picker-label"><span>არხი</span><b>' + fmt(price(colorChannel)) + ' / ცვლილება</b></div>' +
        '<div class="chanrow">' + chans.map(c => '<button class="tagbtn' + (colorChannel === c[0] ? ' on' : '') + '" data-chan="' + c[0] + '">' + esc(c[1]) + '<small>' + fmt(price(c[0])) + '</small></button>').join('') + '</div></div>' +
        '<div class="picker"><div class="picker-label"><span>ფერი</span></div><div class="swatches">' +
        PALETTE.map(p => {
          const staged = (colorChannel in cart) && cart[colorChannel] === p[0];
          const on = !staged && cur === p[0];
          return '<button class="swatch' + (staged ? ' cart' : (on ? ' on' : '')) + '" style="background:' + p[1] + '" data-color="' + p[0] + '" title="#' + p[0] + '"></button>';
        }).join('') + '</div></div>';
    } else if (cat === 'wheels') {
      host.innerHTML = listPicker('wheelType', 'დისკის ტიპი', WHEEL_TYPES) + modPicker('23', 'დისკის დიზაინი');
    } else if (cat === 'body') {
      host.innerHTML = BODY.map(b => modPicker(b[0], b[1])).join('');
    } else if (cat === 'extras') {
      host.innerHTML = EXTRAS.map(b => modPicker(b[0], b[1])).join('') + listPicker('windowTint', 'მინების ტონირება', TINTS);
    }
  }

  function valLabel(c, val) {
    if (c.indexOf('mod:') === 0) return val === -1 ? 'სტოკი' : 'ვარ. ' + (val + 1);
    if (c === 'wheelType') return WHEEL_TYPES[val] || ('#' + val);
    if (c === 'windowTint') return TINTS[val] || ('#' + val);
    return '#' + val;
  }
  function renderCart() {
    const keys = Object.keys(cart);
    let total = 0;
    $('cartList').innerHTML = keys.length ? keys.map(c => {
      total += price(c);
      return '<div class="cart-item"><span>' + esc((CAT_LABEL[c] || c) + ' → ' + valLabel(c, cart[c])) + '</span><span class="ci-price">' + fmt(price(c)) + '</span><button class="ci-del" data-del="' + c + '">×</button></div>';
    }).join('') : '<div class="cart-empty">კალათა ცარიელია</div>';
    $('cartCount').textContent = keys.length;
    $('cartTotal').textContent = fmt(total);
    $('checkout').disabled = !keys.length || total > state.money;
  }

  $('cats').addEventListener('click', (e) => { const b = e.target.closest('[data-tab]'); if (b) { cat = b.getAttribute('data-tab'); renderCats(); renderDetail(); } });
  $('detail').addEventListener('click', (e) => {
    const perf = e.target.closest('[data-perf]'); if (perf) { trigger('cartuning:buy', perf.getAttribute('data-perf')); return; }
    const sw = e.target.closest('[data-color]'); if (sw) { stage(colorChannel, parseInt(sw.getAttribute('data-color'), 10)); return; }
    const chan = e.target.closest('[data-chan]'); if (chan) { colorChannel = chan.getAttribute('data-chan'); renderDetail(); return; }
    const c = e.target.closest('[data-cat]'); if (c && !c.classList.contains('none')) { stage(c.getAttribute('data-cat'), parseInt(c.getAttribute('data-val'), 10)); return; }
  });
  $('cartList').addEventListener('click', (e) => {
    const del = e.target.closest('[data-del]'); if (!del) return;
    delete cart[del.getAttribute('data-del')];
    trigger('cartuning:preview', JSON.stringify(previewConfig()));
    renderDetail(); renderCart();
  });
  $('checkout').onclick = () => { if (Object.keys(cart).length) trigger('cartuning:checkout', JSON.stringify(cart)); };
  $('close').addEventListener('click', () => trigger('cartuning:close'));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') trigger('cartuning:close'); });

  // Drag anywhere on the world (outside the panel) to orbit the camera around the car.
  let dragging = false, lastX = 0;
  document.addEventListener('mousedown', (e) => { if (e.target.closest('.shop')) return; dragging = true; lastX = e.clientX; document.body.style.cursor = 'ew-resize'; });
  document.addEventListener('mousemove', (e) => { if (!dragging) return; const dx = e.clientX - lastX; lastX = e.clientX; if (dx) trigger('cartuning:rotate', dx); });
  document.addEventListener('mouseup', () => { dragging = false; document.body.style.cursor = ''; });

  window.onload = () => { trigger('cartuning:uiReady'); };
</script>
</body>
</html>
