<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#14171c; --card:#1b1f26; --border:#ffffff1a; --gold:#f2c15c; --text:#e8eaed; --muted:#9aa4ad; --green:#4ade80; --red:#ff6b6b; }
  * { box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI',system-ui,sans-serif; }
  html,body { width:100%; height:100%; background:transparent; overflow:hidden; user-select:none; }
  .wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  .panel { width:560px; max-width:94vw; max-height:88vh; background:var(--bg); border:1px solid var(--border); border-radius:16px; box-shadow:0 24px 70px #000b; overflow:hidden; display:flex; flex-direction:column; animation:rise .16s ease-out; }
  @keyframes rise { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
  .head { display:flex; align-items:center; justify-content:space-between; padding:15px 20px; background:linear-gradient(180deg,#222838,#1b1f26); border-bottom:1px solid var(--border); }
  .title { font-size:16px; font-weight:800; color:var(--text); }
  .title small { display:block; font-size:11px; font-weight:600; color:var(--muted); margin-top:3px; }
  .money { font-size:15px; font-weight:800; color:var(--gold); }
  .tabs { display:flex; gap:4px; padding:10px 14px 0; background:var(--bg); }
  .tab { flex:1; padding:9px 6px; font-size:12px; font-weight:700; color:var(--muted); background:transparent; border:none; border-bottom:2px solid transparent; cursor:pointer; }
  .tab.on { color:var(--gold); border-bottom-color:var(--gold); }
  .body { padding:14px 20px; overflow-y:auto; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:11px 0; border-bottom:1px solid #ffffff0d; }
  .row:last-child { border-bottom:none; }
  .row-name { font-size:13.5px; font-weight:700; color:var(--text); }
  .row-sub { font-size:11px; color:var(--muted); margin-top:2px; }
  .sel { background:#00000040; border:1px solid #ffffff20; color:var(--text); border-radius:8px; padding:7px 9px; font-size:12.5px; min-width:150px; }
  .price { font-size:11px; color:var(--gold); font-weight:700; white-space:nowrap; }
  /* performance */
  .pips { display:flex; gap:4px; margin:8px 0; }
  .pip { flex:1; height:7px; border-radius:4px; background:#ffffff14; }
  .pip.on { background:var(--gold); }
  .btn { border:none; border-radius:8px; padding:8px 14px; font-size:12.5px; font-weight:800; cursor:pointer; color:#10131a; background:var(--gold); white-space:nowrap; }
  .btn:hover:not(:disabled){ filter:brightness(1.08); } .btn:disabled{ opacity:.4; cursor:default; }
  .btn.max{ background:#2a2f3a; color:var(--muted); }
  /* colors */
  .chan { display:flex; gap:6px; margin-bottom:12px; }
  .chan button { flex:1; padding:8px 4px; font-size:11.5px; font-weight:700; border:1px solid var(--border); border-radius:8px; background:#00000030; color:var(--muted); cursor:pointer; }
  .chan button.on { border-color:var(--gold); color:var(--gold); }
  .chan button small { display:block; font-size:9.5px; color:var(--gold); margin-top:2px; }
  .swatches { display:grid; grid-template-columns:repeat(10,1fr); gap:7px; }
  .sw { aspect-ratio:1; border-radius:7px; border:2px solid #ffffff14; cursor:pointer; }
  .sw.on { border-color:#fff; box-shadow:0 0 0 2px var(--gold); }
  .foot { padding:12px 20px 16px; display:flex; justify-content:flex-end; border-top:1px solid var(--border); }
  .close { background:#2a2f3a; color:var(--text); border:1px solid var(--border); border-radius:8px; padding:9px 20px; font-weight:700; cursor:pointer; }
  .toast { position:fixed; left:50%; bottom:34px; transform:translateX(-50%); padding:10px 18px; border-radius:10px; font-size:13px; font-weight:700; background:#1f2430; border:1px solid var(--border); opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show{ opacity:1; } .toast.ok{ color:var(--green); } .toast.err{ color:var(--red); }
</style>
</head>
<body>
  <div class="wrap"><div class="panel">
    <div class="head">
      <div class="title">ავტოტუნინგი <small id="carName">—</small></div>
      <div class="money" id="money">$0</div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="body" id="body"></div>
    <div class="foot"><button class="close" id="close">დახურვა</button></div>
  </div></div>
  <div class="toast" id="toast"></div>
<script>
  const RAGE = typeof mp !== 'undefined' && typeof mp.trigger === 'function';
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function money(n){ return '$' + Number(n||0).toLocaleString('en-US'); }
  function buyPerf(k){ if (RAGE) mp.trigger('cartuning:buy', k); }
  function buyVisual(cat, val){ if (RAGE) mp.trigger('cartuning:buyVisual', cat, val); }

  // A spread of GTA paint indices (hex is just the swatch — the index is what the game applies).
  const PALETTE = [
    [0,'#0f1115'],[1,'#1e2024'],[2,'#272a2e'],[3,'#33373c'],[4,'#5b5f66'],[5,'#9a9ea3'],[6,'#73777b'],[8,'#b9b9b9'],[9,'#51565a'],[111,'#ffffff'],
    [27,'#f26f1f'],[11,'#c00e1a'],[12,'#d71e20'],[14,'#a0282c'],[17,'#7e1a1f'],[22,'#db1b2a'],[88,'#f6d84a'],[89,'#fbe70f'],[99,'#d9a40e'],[90,'#b89b5e'],
    [49,'#13263a'],[64,'#304b73'],[70,'#0a86c9'],[73,'#6ea6d8'],[83,'#8fb6d4'],[68,'#2a5d8c'],[146,'#3b1a63'],[145,'#6b1f7d'],[135,'#c42e6f'],[137,'#f3a9c8'],
    [53,'#13402f'],[55,'#1a6b3d'],[51,'#2d4a30'],[151,'#436b36'],[92,'#355f2c'],[38,'#5e3f27'],[96,'#4a4636'],[134,'#cabfa8'],[157,'#b0a99a'],[158,'#1f1f22']
  ];

  let state = { parts:[], money:0, car:'', visual:{}, visualPrices:{}, options:{ mods:{}, wheelTypes:13, windowTints:7 } };
  let tab = 'perf';
  let colorChannel = 'primary';

  const TABS = [ ['perf','ძრავა'], ['colors','ფერი'], ['wheels','დისკები'], ['body','კუზოვი'], ['extras','დამატებითი'] ];
  const WHEEL_TYPES = ['Sport','Muscle','Lowrider','SUV','Offroad','Tuner','Bike','High End','Benny\'s','Benny\'s Bespoke','Open Wheel','Street','Track'];
  const TINTS = ['არა','შავი','მუქი','ღია','ქარხნული','მწვანე','ლიმუზინი'];
  const BODY = [ ['0','სპოილერი'], ['1','წინა ბამპერი'], ['2','უკანა ბამპერი'], ['3','ქვედა ზღუდარები'] ];
  const EXTRAS = [ ['4','გამონაბოლქვი'], ['7','კაპოტი'], ['10','სახურავი'] ];

  window.setTuning = data => {
    try { state = Object.assign(state, (typeof data==='string') ? JSON.parse(data) : data); } catch(e){ return; }
    state.visual = state.visual || {}; state.visual.colors = state.visual.colors || {}; state.visual.mods = state.visual.mods || {};
    state.options = state.options || { mods:{}, wheelTypes:13, windowTints:7 };
    document.getElementById('carName').textContent = state.car || '';
    document.getElementById('money').textContent = money(state.money);
    renderTabs(); render();
  };

  function renderTabs(){
    document.getElementById('tabs').innerHTML = TABS.map(t =>
      '<button class="tab'+(tab===t[0]?' on':'')+'" data-tab="'+t[0]+'">'+esc(t[1])+'</button>').join('');
  }
  document.getElementById('tabs').addEventListener('click', e => {
    const b = e.target.closest('[data-tab]'); if(!b) return;
    tab = b.getAttribute('data-tab'); renderTabs(); render();
  });

  function price(cat){ return state.visualPrices[cat] || 0; }

  // Build a <select> row for a mod category (Stock + N options).
  function modRow(type, label){
    const count = (state.options.mods && state.options.mods[type]) || 0;
    const cur = (state.visual.mods[type] != null) ? state.visual.mods[type] : -1;
    let opts = '<option value="-1"'+(cur===-1?' selected':'')+'>სტოკი</option>';
    for (let i=0;i<count;i++) opts += '<option value="'+i+'"'+(cur===i?' selected':'')+'>ვარიანტი '+(i+1)+'</option>';
    const disabled = count===0 ? ' disabled' : '';
    return '<div class="row"><div><div class="row-name">'+esc(label)+'</div><div class="row-sub">'+count+' ვარიანტი</div></div>'+
      '<div style="display:flex;align-items:center;gap:10px"><span class="price">'+money(price('mod:'+type))+'</span>'+
      '<select class="sel" data-cat="mod:'+type+'"'+disabled+'>'+opts+'</select></div></div>';
  }
  function selectRow(cat, label, names, cur){
    let opts = '';
    for (let i=0;i<names.length;i++) opts += '<option value="'+i+'"'+(cur===i?' selected':'')+'>'+esc(names[i])+'</option>';
    return '<div class="row"><div><div class="row-name">'+esc(label)+'</div></div>'+
      '<div style="display:flex;align-items:center;gap:10px"><span class="price">'+money(price(cat))+'</span>'+
      '<select class="sel" data-cat="'+cat+'">'+opts+'</select></div></div>';
  }

  function render(){
    const host = document.getElementById('body');
    if (tab === 'perf'){
      host.innerHTML = (state.parts||[]).map(p => {
        const pips = Array.from({length:p.max},(_,i)=>'<span class="pip'+(i<p.level?' on':'')+'"></span>').join('');
        const btn = p.atMax ? '<button class="btn max" disabled>მაქსიმუმი</button>'
          : '<button class="btn" data-perf="'+esc(p.key)+'"'+(p.canAfford?'':' disabled')+'>'+money(p.nextPrice)+'</button>';
        return '<div class="row" style="display:block"><div style="display:flex;justify-content:space-between;align-items:center">'+
          '<div><div class="row-name">'+esc(p.label)+'</div><div class="row-sub">'+esc(p.effect)+' · დონე '+p.level+'/'+p.max+'</div></div>'+btn+'</div>'+
          '<div class="pips">'+pips+'</div></div>';
      }).join('');
    } else if (tab === 'colors'){
      const ch = [['primary','ძირითადი'],['secondary','მეორადი'],['pearl','პერლამუტრი'],['wheel','დისკების ფერი']];
      const cur = state.visual.colors[colorChannel];
      host.innerHTML =
        '<div class="chan">'+ch.map(c=>'<button data-chan="'+c[0]+'" class="'+(colorChannel===c[0]?'on':'')+'">'+esc(c[1])+'<small>'+money(price(c[0]))+'</small></button>').join('')+'</div>'+
        '<div class="swatches">'+PALETTE.map(p=>'<div class="sw'+(cur===p[0]?' on':'')+'" style="background:'+p[1]+'" data-color="'+p[0]+'" title="#'+p[0]+'"></div>').join('')+'</div>'+
        '<div class="row-sub" style="margin-top:12px">აირჩიე არხი, შემდეგ ფერი — თითო ცვლილება ფასიანია.</div>';
    } else if (tab === 'wheels'){
      host.innerHTML =
        selectRow('wheelType','დისკის ტიპი', WHEEL_TYPES, (state.visual.wheelType!=null?state.visual.wheelType:-99)) +
        modRow('23','დისკის დიზაინი') +
        '<div class="row-sub" style="margin-top:12px">დისკების ფერი — „ფერი“ ტაბში.</div>';
    } else if (tab === 'body'){
      host.innerHTML = BODY.map(b=>modRow(b[0], b[1])).join('');
    } else if (tab === 'extras'){
      host.innerHTML = EXTRAS.map(b=>modRow(b[0], b[1])).join('') +
        selectRow('windowTint','მინების ტონირება', TINTS, (state.visual.windowTint!=null?state.visual.windowTint:0));
    }
  }

  document.getElementById('body').addEventListener('click', e => {
    const perf = e.target.closest('[data-perf]'); if (perf){ buyPerf(perf.getAttribute('data-perf')); return; }
    const sw = e.target.closest('[data-color]'); if (sw){ buyVisual(colorChannel, parseInt(sw.getAttribute('data-color'),10)); return; }
    const chan = e.target.closest('[data-chan]'); if (chan){ colorChannel = chan.getAttribute('data-chan'); render(); return; }
  });
  document.getElementById('body').addEventListener('change', e => {
    const sel = e.target.closest('[data-cat]'); if (!sel) return;
    buyVisual(sel.getAttribute('data-cat'), parseInt(sel.value,10));
  });

  document.getElementById('close').onclick = () => { if (RAGE) mp.trigger('cartuning:close'); };
  document.addEventListener('keydown', e => { if (e.key==='Escape' && RAGE) mp.trigger('cartuning:close'); });

  let toastTimer;
  window.tuningResult = data => {
    let r; try { r = (typeof data==='string')?JSON.parse(data):data; } catch(e){ return; }
    const t = document.getElementById('toast');
    t.textContent = r.msg || ''; t.className = 'toast show ' + (r.ok?'ok':'err');
    clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ t.className='toast'; }, 2200);
  };

  window.onload = () => { if (RAGE) mp.trigger('cartuning:uiReady'); };
</script>
</body>
</html>
