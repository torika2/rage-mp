<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>HUD</title>
<style>
  :root {
    --accent: #ffb42e;
    --accent-dim: #b87d10;
    --panel: rgba(20, 22, 26, 0.82);
    --text: #eef2f4;
    --muted: #9aa4ad;
    --danger: #ff5b5b;
    --border: rgba(255, 255, 255, 0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", Roboto, system-ui, sans-serif; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none; }

  /* Money chip — top right */
  #money {
    position: absolute; top: 18px; right: 22px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 999px;
    padding: 8px 16px; color: var(--accent); font-weight: 800; font-size: 17px;
    letter-spacing: .3px; box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }

  /* Speedometer — bottom right */
  #speedo {
    position: absolute; bottom: 26px; right: 22px; width: 232px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 16px 18px; color: var(--text);
    box-shadow: 0 12px 36px rgba(0,0,0,.5); opacity: 0; transform: translateY(10px);
    transition: opacity .2s, transform .2s;
  }
  #speedo.on { opacity: 1; transform: none; }

  .topline { display: flex; align-items: flex-end; justify-content: space-between; }
  .speed { font-size: 46px; font-weight: 800; line-height: .9; letter-spacing: -1px; }
  .speed small { font-size: 15px; font-weight: 600; color: var(--muted); margin-left: 4px; }
  .badges { text-align: right; }
  .gear { font-size: 20px; font-weight: 800; }
  .eng { font-size: 12px; font-weight: 700; margin-top: 3px; }
  .eng.on { color: #66d17a; } .eng.off { color: var(--danger); }

  .bar { height: 7px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden; margin-top: 12px; }
  .bar > div { height: 100%; width: 0%; border-radius: 999px; transition: width .12s linear; }
  #rpmFill { background: linear-gradient(90deg, var(--accent-dim), var(--accent)); }
  #fuelFill { background: var(--accent); }
  #fuelFill.low { background: var(--danger); }
  .barlabel { display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 1px;
              color: var(--muted); text-transform: uppercase; margin-top: 8px; }
  #fuelPct { color: var(--text); font-weight: 700; }
  #fuelPct.low { color: var(--danger); }

  .engctrl { display: flex; align-items: center; gap: 8px; margin-top: 13px; }
  .eico { width: 32px; height: 32px; border-radius: 10px; display: flex; align-items: center;
          justify-content: center; font-size: 17px; background: rgba(255,255,255,0.08);
          border: 1px solid var(--border); transition: .15s; }
  .eico.on  { color: #66d17a; border-color: rgba(102,209,122,.6); background: rgba(102,209,122,.12); }
  .eico.off { color: var(--danger); border-color: rgba(255,91,91,.5); background: rgba(255,91,91,.10); }
  .ekey { font-size: 12px; font-weight: 800; padding: 6px 11px; border-radius: 8px; color: var(--text);
          background: rgba(255,255,255,0.10); border: 1px solid var(--border); }
  .elbl { font-size: 11px; color: var(--muted); }

  #prompt {
    position: absolute; left: 50%; bottom: 13%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: 15px; font-weight: 600;
    box-shadow: 0 8px 24px rgba(0,0,0,.4); display: none; white-space: nowrap;
  }
  #prompt b { color: var(--accent); }

  #voice {
    position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%);
    display: none; align-items: center; gap: 8px;
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 8px 16px; border-radius: 999px; font-size: 14px; font-weight: 700;
    box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  #voice.talking { border-color: #66d17a; color: #bff0c8; }
  #voice.talking .dot { width: 9px; height: 9px; border-radius: 50%; background: #66d17a; animation: pulse 1s infinite; }
  #voice.banned { border-color: var(--danger); color: #ffd4d4; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }

  #chatch {
    position: absolute; left: 22px; bottom: 26%;
    background: var(--panel); border: 1px solid var(--accent); color: var(--text);
    padding: 8px 14px; border-radius: 10px; font-size: 14px; font-weight: 700;
    box-shadow: 0 8px 24px rgba(0,0,0,.4); display: none;
  }
  #chatch small { color: var(--muted); font-weight: 500; margin-right: 6px; }
  #chatch b { color: var(--accent); }

  /* Vehicle target badge — bottom right (matching outside vehicle look) */
  #targetVehBadge {
    position: fixed;
    right: 32px;
    bottom: 32px;
    left: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 18px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    display: none;
    flex-direction: column;
    gap: 9px;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity .16s ease, transform .16s ease;
    z-index: 100;
  }
  #targetVehBadge.visible {
    display: flex;
    opacity: 1;
    transform: none;
  }
  .hud-row-stats {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .stat-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 13.5px;
    font-weight: 700;
    color: #f3f4f6;
  }
  .stat-item svg {
    width: 17px;
    height: 17px;
    fill: currentColor;
    color: var(--accent);
    flex-shrink: 0;
  }
  .stat-item .unit {
    color: var(--muted);
    font-weight: 500;
  }
  .indicator-badges {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-left: 4px;
  }
  .badge-icon {
    width: 26px;
    height: 26px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3);
  }
  .badge-icon svg {
    width: 14px;
    height: 14px;
    fill: #ffffff;
  }
  .badge-lock.locked { background: #dc2626; }
  .badge-lock.unlocked { background: #16a34a; }
  .badge-engine.running { background: #16a34a; }
  .badge-engine.off { background: #4b5563; }
  .hud-row-hint {
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .key-diamond {
    width: 18px;
    height: 18px;
    background: var(--accent);
    border-radius: 3px;
    transform: rotate(45deg);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 2px 6px rgba(245, 166, 35, 0.35);
  }
  .key-letter {
    transform: rotate(-45deg);
    font-size: 11px;
    font-weight: 900;
    color: #111827;
    line-height: 1;
  }
  .hint-text {
    font-size: 12px;
    font-weight: 500;
    color: #d1d5db;
  }

  /* Ground item pickup prompt */
  #pickup {
    position: absolute; left: 50%; bottom: 18%; transform: translateX(-50%); display: none;
    background: rgba(15, 19, 25, .96); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: 15px; font-weight: 600; box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }
  #pickup b { color: var(--accent); }
  #pickupLabel { color: var(--accent); }

  /* Character stats — bottom right (moves above the speedometer in a vehicle) */
  #stats {
    position: absolute; right: 22px; bottom: 26px; width: 232px;
    background: rgba(15, 19, 25, .96); border: 1px solid var(--border); border-radius: 16px;
    padding: 12px 16px; color: var(--text); box-shadow: 0 12px 36px rgba(0,0,0,.5);
    display: grid; gap: 9px; transition: bottom .2s;
  }
  .stat { display: grid; grid-template-columns: 20px 1fr 34px; align-items: center; gap: 9px; }
  .stat .ico { font-size: 14px; text-align: center; line-height: 1; }
  .stat .track { height: 7px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden; }
  .stat .fill { height: 100%; width: 100%; border-radius: 999px; transition: width .4s; }
  .stat .val { font-size: 12px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  #stHealth .fill { background: #ff5b5b; }
  #stArmour .fill { background: #5aa9ff; }
  #stHunger .fill { background: var(--accent); }
  #stThirst .fill { background: #3fd0e0; }
  .stat.low .val { color: var(--danger); }
  .stat.low .ico { animation: stat-pulse 1s infinite; }
  @keyframes stat-pulse { 50% { opacity: .35; } }

  /* Ammo — just under the crosshair while aiming a gun */
  #ammo {
    position: absolute; left: 50%; top: calc(50% + 34px); transform: translate(-50%, 6px);
    display: flex; align-items: baseline; gap: 6px;
    color: var(--text); text-shadow: 0 1px 3px rgba(0,0,0,.9), 0 0 8px rgba(0,0,0,.6);
    opacity: 0; transition: opacity .12s, transform .12s; pointer-events: none;
  }
  #ammo.on { opacity: 1; transform: translate(-50%, 0); }
  #ammo .clip { font-size: 18px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
  #ammo .sep { color: var(--muted); font-size: 13px; }
  #ammo .reserve { font-size: 13px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
  #ammo.low .clip { color: var(--danger); }
</style>
</head>
<body>
<div id="ammo"><span class="clip">0</span><span class="sep">/</span><span class="reserve">0</span></div>
  <div id="money">$0</div>

  <div id="stats">
    <div class="stat" id="stHealth" title="სიცოცხლე"><span class="ico">❤️</span><div class="track"><div class="fill"></div></div><span class="val">100</span></div>
    <div class="stat" id="stArmour" title="ჯავშანი"><span class="ico">🛡️</span><div class="track"><div class="fill"></div></div><span class="val">0</span></div>
    <div class="stat" id="stHunger" title="შიმშილი"><span class="ico">🍔</span><div class="track"><div class="fill"></div></div><span class="val">100</span></div>
    <div class="stat" id="stThirst" title="წყურვილი"><span class="ico">💧</span><div class="track"><div class="fill"></div></div><span class="val">100</span></div>
  </div>

  <div id="speedo">
    <div class="topline">
      <div class="speed"><span id="kmh">0</span><small>კმ/სთ</small></div>
      <div class="badges">
        <div class="gear" id="gear">N</div>
        <div class="eng off" id="eng">○ გამ.</div>
      </div>
    </div>
    <div class="bar"><div id="rpmFill"></div></div>
    <div class="bar"><div id="fuelFill"></div></div>
    <div class="barlabel"><span>საწვავი</span><span id="fuelPct">100%</span></div>
    <div class="engctrl">
      <div class="eico off" id="engIco">⏻</div>
      <div class="ekey">2</div>
      <div class="elbl" id="engLbl">ძრავი</div>
    </div>
  </div>

  <div id="pickup">დააჭირე <b>E</b>-ს ასაღებად: <span id="pickupLabel"></span></div>
  <div id="prompt">დააჭირე <b>E</b>-ს საწვავის შესავსებად</div>

  <!-- Vehicle interaction indicator (when looking at a car outside) -->
  <div id="targetVehBadge">
    <div class="hud-row-stats">
      <div class="stat-item">
        <svg viewBox="0 0 24 24"><path d="M19.77 7.23l.01-.01-3.72-3.72L15 4.56l2.11 2.11c-.94.36-1.61 1.26-1.61 2.33 0 1.38 1.12 2.5 2.5 2.5.36 0 .69-.08 1-.21v7.21c0 .55-.45 1-1 1s-1-.45-1-1V14c0-1.1-.9-2-2-2h-1V5c0-1.1-.9-2-2-2H6c-1.1 0-2 .9-2 2v16h10v-7.5h1.5v5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V9c0-.69-.28-1.32-.73-1.77zM12 10H6V5h6v5zm6 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/></svg>
        <span id="targetFuelText">113 / 130</span>
        <span class="unit">ლ.</span>
      </div>
      <div class="stat-item">
        <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/></svg>
        <span id="targetHpText">100</span>%
        <span class="unit">HP CAR</span>
      </div>
      <div class="indicator-badges">
        <div id="targetBadgeLock" class="badge-icon badge-lock locked" title="მანქანის საკეტი">
          <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        </div>
        <div id="targetBadgeEngine" class="badge-icon badge-engine off" title="ძრავის სტატუსი">
          <svg viewBox="0 0 24 24"><path d="M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"/></svg>
        </div>
      </div>
    </div>
    <div class="hud-row-hint">
      <div class="key-diamond">
        <span class="key-letter">G</span>
      </div>
      <span class="hint-text">დააჭირეთ ურთიერთქმედებისთვის</span>
    </div>
  </div>

  <div id="chatch"><small>TAB — არხი:</small> <b id="chatchName">ლოკალური</b></div>

  <div id="voice"></div>

<script>
  // Ammo chip: window.hudAmmo({ clip, reserve }) shows it, window.hudAmmo(null) hides it.
  window.hudAmmo = function (a) {
    const el = document.getElementById('ammo');
    if (!a) { el.classList.remove('on'); return; }
    el.querySelector('.clip').textContent = a.clip;
    el.querySelector('.reserve').textContent = a.reserve;
    el.classList.toggle('low', a.clip < 10);
    el.classList.add('on');
  };
  const $ = id => document.getElementById(id);
  window.setChatChannel = function (label, visible) {
    $('chatchName').textContent = label;
    $('chatch').style.display = visible ? 'block' : 'none';
  };
  // Called by the client ~20x/sec.
  window.hud = function (d) {
    $('money').textContent = '$' + (d.money || 0).toLocaleString();
    $('prompt').style.display = d.refuel ? 'block' : 'none';
    $('pickup').style.display = d.pickup ? 'block' : 'none';
    if (d.pickup) $('pickupLabel').textContent = d.pickup;

    // Target vehicle indicator outside
    const tv = $('targetVehBadge');
    if (tv) {
      if (d.targetVehicle && !d.inVehicle && !d.vehicleMenuOpen) {
        $('targetFuelText').textContent = `${d.targetVehicle.fuel} / ${d.targetVehicle.maxFuel}`;
        $('targetHpText').textContent = `${d.targetVehicle.health}`;
        const bLock = $('targetBadgeLock');
        bLock.className = 'badge-icon badge-lock ' + (d.targetVehicle.locked ? 'locked' : 'unlocked');
        const bEng = $('targetBadgeEngine');
        bEng.className = 'badge-icon badge-engine ' + (d.targetVehicle.engine ? 'running' : 'off');
        tv.classList.add('visible');
      } else {
        tv.classList.remove('visible');
      }
    }

    const v = $('voice');
    if (d.voiceBanned) {
      v.className = 'banned'; v.style.display = 'flex';
      v.innerHTML = '🔇 <span>მიკროფონი დაბლოკილია</span>';
    } else if (d.voiceTalking) {
      v.className = 'talking'; v.style.display = 'flex';
      v.innerHTML = '<span class="dot"></span>🎤 <span>საუბრობ...</span>';
    } else {
      v.style.display = 'none';
    }
    // Character stats (bottom right); sits above the speedometer while in a vehicle.
    [['stHealth', d.health], ['stArmour', d.armour], ['stHunger', d.hunger], ['stThirst', d.thirst]].forEach(([id, v]) => {
      const el = $(id); if (!el || typeof v !== 'number') return;
      const pct = Math.max(0, Math.min(100, Math.round(v)));
      el.querySelector('.fill').style.width = pct + '%';
      el.querySelector('.val').textContent = pct;
      el.classList.toggle('low', id !== 'stArmour' && pct <= 20);
    });
    const sp = $('speedo');
    $('stats').style.bottom = d.inVehicle ? (26 + sp.offsetHeight + 12) + 'px' : '26px';
    if (!d.inVehicle) { sp.classList.remove('on'); return; }
    sp.classList.add('on');
    $('kmh').textContent = d.kmh;
    $('gear').textContent = d.gear <= 0 ? 'N' : d.gear;
    const eng = $('eng');
    eng.textContent = d.engineOn ? '● ჩართ.' : '○ გამ.';
    eng.className = 'eng ' + (d.engineOn ? 'on' : 'off');
    const ei = $('engIco'); ei.className = 'eico ' + (d.engineOn ? 'on' : 'off');
    $('engLbl').textContent = d.engineOn ? 'ძრავი ჩართ.' : 'ძრავი გამ.';
    $('rpmFill').style.width = Math.round(d.rpm * 100) + '%';
    const low = d.fuel <= 15;
    const ff = $('fuelFill'); ff.style.width = Math.round(d.fuel) + '%'; ff.className = low ? 'low' : '';
    const fp = $('fuelPct');
    fp.textContent = Math.round(d.fuel) + '%' + (d.octane ? '  ·  ' + d.octane : '');
    fp.className = low ? 'low' : '';
  };
  // demo when opened in a plain browser
  if (typeof mp === 'undefined')
    window.hud({ money: 4200, inVehicle: true, kmh: 138, gear: 5, engineOn: true, rpm: 0.72, fuel: 46, voiceTalking: true });
</script>
</body>
</html>
