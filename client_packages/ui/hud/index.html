<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>HUD</title>
<style>
  :root {
    --accent: #ffb42e;
    --accent-dim: #b87d10;
    --panel: rgba(20, 22, 26, 0.82);
    --text: #eef2f4;
    --muted: #9aa4ad;
    --danger: #ff5b5b;
    --border: rgba(255, 255, 255, 0.08);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Segoe UI", Roboto, system-ui, sans-serif; }
  html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; user-select: none; }

  /* Money chip — top right */
  #money {
    position: absolute; top: 18px; right: 22px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 999px;
    padding: 8px 16px; color: var(--accent); font-weight: 800; font-size: 17px;
    letter-spacing: .3px; box-shadow: 0 8px 24px rgba(0,0,0,.4);
  }

  /* Speedometer — bottom right */
  #speedo {
    position: absolute; bottom: 26px; right: 22px; width: 232px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 16px;
    padding: 16px 18px; color: var(--text);
    box-shadow: 0 12px 36px rgba(0,0,0,.5); opacity: 0; transform: translateY(10px);
    transition: opacity .2s, transform .2s;
  }
  #speedo.on { opacity: 1; transform: none; }

  .topline { display: flex; align-items: flex-end; justify-content: space-between; }
  .speed { font-size: 46px; font-weight: 800; line-height: .9; letter-spacing: -1px; }
  .speed small { font-size: 15px; font-weight: 600; color: var(--muted); margin-left: 4px; }
  .badges { text-align: right; }
  .gear { font-size: 20px; font-weight: 800; }
  .eng { font-size: 12px; font-weight: 700; margin-top: 3px; }
  .eng.on { color: #66d17a; } .eng.off { color: var(--danger); }

  .bar { height: 7px; border-radius: 999px; background: rgba(255,255,255,0.08); overflow: hidden; margin-top: 12px; }
  .bar > div { height: 100%; width: 0%; border-radius: 999px; transition: width .12s linear; }
  #rpmFill { background: linear-gradient(90deg, var(--accent-dim), var(--accent)); }
  #fuelFill { background: var(--accent); }
  #fuelFill.low { background: var(--danger); }
  .barlabel { display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 1px;
              color: var(--muted); text-transform: uppercase; margin-top: 8px; }
  #fuelPct { color: var(--text); font-weight: 700; }
  #fuelPct.low { color: var(--danger); }

  #prompt {
    position: absolute; left: 50%; bottom: 13%; transform: translateX(-50%);
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: 15px; font-weight: 600;
    box-shadow: 0 8px 24px rgba(0,0,0,.4); display: none; white-space: nowrap;
  }
  #prompt b { color: var(--accent); }
</style>
</head>
<body>
  <div id="money">$0</div>

  <div id="speedo">
    <div class="topline">
      <div class="speed"><span id="kmh">0</span><small>კმ/სთ</small></div>
      <div class="badges">
        <div class="gear" id="gear">N</div>
        <div class="eng off" id="eng">○ გამ.</div>
      </div>
    </div>
    <div class="bar"><div id="rpmFill"></div></div>
    <div class="bar"><div id="fuelFill"></div></div>
    <div class="barlabel"><span>საწვავი</span><span id="fuelPct">100%</span></div>
  </div>

  <div id="prompt">დააჭირე <b>E</b>-ს საწვავის შესავსებად</div>

<script>
  const $ = id => document.getElementById(id);
  // Called by the client ~20x/sec.
  window.hud = function (d) {
    $('money').textContent = '$' + (d.money || 0).toLocaleString();
    $('prompt').style.display = d.refuel ? 'block' : 'none';
    const sp = $('speedo');
    if (!d.inVehicle) { sp.classList.remove('on'); return; }
    sp.classList.add('on');
    $('kmh').textContent = d.kmh;
    $('gear').textContent = d.gear <= 0 ? 'N' : d.gear;
    const eng = $('eng');
    eng.textContent = d.engineOn ? '● ჩართ.' : '○ გამ.';
    eng.className = 'eng ' + (d.engineOn ? 'on' : 'off');
    $('rpmFill').style.width = Math.round(d.rpm * 100) + '%';
    const low = d.fuel <= 15;
    const ff = $('fuelFill'); ff.style.width = Math.round(d.fuel) + '%'; ff.className = low ? 'low' : '';
    const fp = $('fuelPct');
    fp.textContent = Math.round(d.fuel) + '%' + (d.octane ? '  ·  ' + d.octane : '');
    fp.className = low ? 'low' : '';
  };
  // demo when opened in a plain browser
  if (typeof mp === 'undefined')
    window.hud({ money: 4200, inVehicle: true, kmh: 138, gear: 5, engineOn: true, rpm: 0.72, fuel: 46 });
</script>
</body>
</html>
