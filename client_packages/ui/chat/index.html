<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8" />
<title>Chat</title>
<style>
  :root {
    --panel: rgba(16, 18, 22, 0.72);
    --panel-solid: rgba(20, 22, 27, 0.95);
    --text: #eef2f4;
    --muted: #8a949e;
    --border: rgba(255,255,255,0.08);
    --accent: #ffb42e;
    --local: #c9d1d9;
    --team: #4aa3ff;
    --global: #ffb42e;
    --system: #9aa4ad;
    --action: #c58bff;
  }
  * { margin:0; padding:0; box-sizing:border-box; font-family:"Segoe UI", Roboto, system-ui, sans-serif; }
  html, body { width:100%; height:100%; background:transparent; overflow:hidden; user-select:none; }

  #chat {
    position:absolute; left:16px; top:16px; width:520px; max-width:42vw;
    display:flex; flex-direction:column; gap:6px;
  }

  #chatrow { display:flex; gap:6px; align-items:flex-start; }
  #tabs { display:none; flex-direction:column; gap:6px; flex:none; }
  #chat.open #tabs { display:flex; }
  .tab {
    font-size:12px; font-weight:700; padding:5px 12px; border-radius:8px; cursor:pointer;
    background:var(--panel); border:1px solid var(--border); color:var(--muted);
  }
  .tab.active { color:#111; }
  .tab[data-ch="all"].active    { background:#e6eaee; }
  .tab[data-ch="local"].active  { background:var(--local); }
  .tab[data-ch="team"].active   { background:var(--team); color:#fff; }
  .tab[data-ch="global"].active { background:var(--global); }

  #log {
    list-style:none; flex:1; max-height:300px; overflow-y:auto; padding:10px 12px;
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    display:flex; flex-direction:column; gap:3px; scrollbar-width:thin;
    transition:background .2s, max-height .2s;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22px);
  }
  #chat.open #log { max-height:72vh; background:var(--panel-solid); -webkit-mask-image:none; }
  #log::-webkit-scrollbar { width:6px; }
  #log::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.15); border-radius:3px; }

  .msg { font-size:14px; line-height:1.35; color:var(--text); word-wrap:break-word; animation:fade .18s ease-out; }
  @keyframes fade { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:none; } }
  .msg .ts { color:var(--muted); font-size:11px; margin-right:6px; }
  .msg .cbadge { font-size:10px; font-weight:800; padding:0 5px; border-radius:4px; margin-right:6px; color:#111; }
  .cbadge.local  { background:var(--local); }
  .cbadge.team   { background:var(--team); color:#fff; }
  .cbadge.global { background:var(--global); }
  .msg .nm { font-weight:700; }
  .msg.local  .nm { color:var(--local); }
  .msg.team   .nm { color:var(--team); }
  .msg.global .nm { color:var(--global); }
  .msg.system { color:var(--system); }
  .msg.action { color:var(--action); font-style:italic; }

  #inputbar {
    display:none; align-items:center; gap:8px;
    background:var(--panel-solid); border:1px solid var(--accent); border-radius:12px; padding:8px 10px;
    animation:slide .15s ease-out;
  }
  @keyframes slide { from { opacity:0; transform:translateY(6px);} to { opacity:1; transform:none; } }
  #chBadge { font-size:12px; font-weight:800; padding:5px 10px; border-radius:8px; color:#111; white-space:nowrap; }
  #chBadge.local  { background:var(--local); }
  #chBadge.team   { background:var(--team); color:#fff; }
  #chBadge.global { background:var(--global); }
  #input {
    flex:1; background:transparent; border:none; outline:none; color:var(--text);
    font-size:15px; font-family:inherit;
  }
  #hint { font-size:10px; color:var(--muted); white-space:nowrap; }

  #placeholder {
    font-size:12px; color:var(--muted); padding:5px 12px; width:fit-content;
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
  }
  #placeholder b { color:var(--accent); font-weight:800; }
  #chat.open #placeholder { display:none; }

  /* auto-hide switch (in the input bar) */
  .hsw { width:34px; height:18px; border-radius:999px; background:rgba(255,255,255,0.14);
         position:relative; cursor:pointer; flex:none; transition:background .15s; }
  .hsw i { position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%;
           background:#fff; transition:left .15s; }
  .hsw.on { background:var(--accent); }
  .hsw.on i { left:18px; }
  .hlbl { font-size:11px; color:var(--muted); white-space:nowrap; }
  /* when auto-hide is on and the chat is closed, hide the messages but keep the "press T" reminder */
  #chat.autohide:not(.open) #chatrow { display:none; }
</style>
</head>
<body>
  <div id="chat">
    <div id="chatrow">
      <ul id="log"></ul>
      <div id="tabs">
        <div class="tab active" data-ch="all">ყველა</div>
        <div class="tab" data-ch="local">ლოკ.</div>
        <div class="tab" data-ch="team">გუნდი</div>
        <div class="tab" data-ch="global">გლობ.</div>
      </div>
    </div>
    <div id="inputbar">
      <span id="chBadge" class="local">ლოკალური</span>
      <input id="input" maxlength="200" autocomplete="off" />
      <div id="hideSw" class="hsw" title="ჩატის ავტო-დამალვა"><i></i></div>
      <span class="hlbl">დამალვა</span>
      <span id="hint">TAB • Enter • Esc</span>
    </div>
    <div id="placeholder">დააჭირეთ <b>T</b>-ს ჩათის გასახსნელად</div>
  </div>

<script>
  const RAGE = (typeof mp !== 'undefined');
  const $ = id => document.getElementById(id);
  const CH = {
    local:  { label:'ლოკალური',   short:'ლოკ.' },
    team:   { label:'გუნდი',       short:'გუნდი' },
    global: { label:'გლობალური',   short:'გლობ.' }
  };

  let available = ['local', 'global'];
  let channel = 'local';
  let filter = 'all';
  let autoHide = false; // off by default
  const MAX = 200;

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  // parse RAGE !{#hex} colour codes (used by legacy command/system replies)
  function parseColors(s) {
    let html = escapeHtml(s).replace(/!\{#([0-9a-fA-F]{6})\}/g, '</span><span style="color:#$1">');
    return '<span>' + html + '</span>';
  }
  function two(n){ return n < 10 ? '0'+n : ''+n; }
  function stamp(ts){ const d = new Date(ts||Date.now()); return two(d.getHours())+':'+two(d.getMinutes()); }

  function applyFilter() {
    document.querySelectorAll('#log .msg').forEach(el => {
      const c = el.dataset.ch;
      el.style.display = (filter === 'all' || c === filter || c === 'system') ? '' : 'none';
    });
    const log = $('log'); log.scrollTop = log.scrollHeight;
  }

  window.addMsg = function (json) {
    let m; try { m = (typeof json === 'string') ? JSON.parse(json) : json; } catch(e){ return; }
    const li = document.createElement('li');
    const ch = m.ch || 'system';
    li.className = 'msg ' + ch + (m.action ? ' action' : '');
    li.dataset.ch = ch;

    let inner = `<span class="ts">${stamp(m.ts)}</span>`;
    if (ch === 'system') {
      inner += parseColors(m.text);
    } else if (m.action) {
      const body = escapeHtml(String(m.text).replace(/^\/(me|do)\s*/i, ''));
      inner += `<span>* ${escapeHtml(m.name)} ${body}</span>`;
    } else {
      const badge = CH[ch] ? `<span class="cbadge ${ch}">${CH[ch].short}</span>` : '';
      inner += `${badge}<span class="nm">${escapeHtml(m.name)}:</span> <span>${escapeHtml(m.text)}</span>`;
    }
    li.innerHTML = inner;

    const log = $('log');
    log.appendChild(li);
    while (log.children.length > MAX) log.removeChild(log.firstChild);
    if (filter !== 'all' && ch !== 'system' && ch !== filter) li.style.display = 'none';
    log.scrollTop = log.scrollHeight;
  };

  function setBadge() {
    const b = $('chBadge'); b.className = channel; b.textContent = CH[channel].label;
  }
  window.openInput = function (channelsJson, current) {
    try { available = JSON.parse(channelsJson); } catch(e){ available = ['local','global']; }
    if (available.indexOf(current) >= 0) channel = current;
    else if (available.indexOf(channel) < 0) channel = available[0];
    setBadge();
    $('chat').classList.add('open');
    $('inputbar').style.display = 'flex';
    const inp = $('input'); inp.value = '';
    setTimeout(() => inp.focus(), 0);
    $('log').scrollTop = $('log').scrollHeight;
  };
  window.closeInput = function () {
    $('inputbar').style.display = 'none';
    $('chat').classList.remove('open');
    $('input').blur();
  };
  window.setChatChannel = function (key) { if (CH[key]) { channel = key; setBadge(); } };

  function cycle() {
    let i = available.indexOf(channel);
    channel = available[(i + 1) % available.length];
    setBadge();
  }

  $('input').addEventListener('keydown', e => {
    if (e.key === 'Tab') { e.preventDefault(); cycle(); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      const text = $('input').value.trim();
      $('input').value = '';               // clear but keep the box open for the next message
      if (text && RAGE) mp.trigger('chat:send', text, channel);
      $('input').focus();
    } else if (e.key === 'Escape') {
      e.preventDefault();
      if (RAGE) mp.trigger('chat:cancel');
    }
  });
  $('hideSw').onclick = () => {
    autoHide = !autoHide;
    $('hideSw').classList.toggle('on', autoHide);
    $('chat').classList.toggle('autohide', autoHide);
  };
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active'); filter = t.dataset.ch; applyFilter();
  });

  // demo when opened in a plain browser
  if (!RAGE) {
    document.getElementById('chat').classList.add('open');
    document.getElementById('inputbar').style.display = 'flex';
    window.addMsg({ch:'global', name:'Nika', text:'გამარჯობა ყველას! 👋', ts:Date.now()});
    window.addMsg({ch:'local', name:'Data', text:'აქ ვარ, ახლოს', ts:Date.now()});
    window.addMsg({ch:'team', name:'Officer', text:'პატრული დაიწყო', ts:Date.now()});
    window.addMsg({ch:'local', name:'Gio', text:'/me უყურებს მანქანას', action:true, ts:Date.now()});
    window.addMsg({ch:'system', text:'!{#8ed17a}შეივსო 40ლ · $120', ts:Date.now()});
  }
</script>
</body>
</html>
