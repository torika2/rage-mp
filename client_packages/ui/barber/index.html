<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>სალონი</title>
<style>
  :root {
    color-scheme: dark;
    --gold: #f2c15c;
    --gold-soft: rgba(242, 193, 92, .48);
    --accent: #7ac8d0;
    --text: #f3f0e8;
    --muted: #aaa79e;
    --line: rgba(255, 255, 255, .12);
    --panel: linear-gradient(180deg, #131518, #0e1012);
    font-family: "Noto Sans Georgian", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
  body { color: var(--text); background: transparent; user-select: none; }
  button { color: inherit; font: inherit; cursor: pointer; }
  .veil { position: absolute; inset: 0; display: flex; justify-content: flex-end; animation: appear .18s ease-out; }
  .shop { width: min(760px, 44vw); height: 100%; display: grid; grid-template-rows: 62px minmax(0, 1fr) auto; background: var(--panel); border-left: 1px solid var(--gold-soft); box-shadow: -18px 0 40px rgba(0, 0, 0, .45); animation: slide .22s ease-out; }
  .head { display: flex; align-items: center; gap: 14px; padding: 0 22px; border-bottom: 1px solid var(--line); }
  .title { display: flex; flex-direction: column; }
  .title h1 { margin: 0; font-size: 16px; font-weight: 700; }
  .title span { color: var(--muted); font-size: 11px; }
  .spacer { flex: 1; }
  .money { color: var(--gold); font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .close { width: 34px; height: 34px; border: 1px solid var(--line); background: rgba(255, 255, 255, .04); color: var(--muted); font-size: 18px; }
  .close:hover { color: var(--gold); border-color: var(--gold-soft); }
  .body { min-height: 0; display: grid; grid-template-columns: minmax(180px, .8fr) minmax(280px, 1.2fr); }
  .cats { overflow: auto; padding: 14px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
  .cat { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid transparent; border-radius: 10px; background: rgba(255, 255, 255, .03); color: var(--text); font-size: 13px; text-align: left; }
  .cat:hover { background: rgba(255, 255, 255, .06); }
  .cat.on { border-color: var(--gold-soft); background: rgba(242, 193, 92, .1); color: var(--gold); }
  .cat .cat-price { margin-left: auto; color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .cat .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: 0 0 auto; }
  .detail { overflow: auto; padding: 22px; display: flex; flex-direction: column; gap: 22px; }
  .detail h2 { margin: 0; font-size: 15px; font-weight: 700; }
  .picker { display: grid; gap: 8px; }
  .picker-label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .stepper { display: grid; grid-template-columns: 46px 1fr 46px; align-items: center; gap: 8px; }
  .stepper button { height: 46px; border: 1px solid var(--line); background: rgba(255, 255, 255, .04); font-size: 20px; border-radius: 10px; }
  .stepper button:hover { border-color: var(--gold-soft); color: var(--gold); }
  .stepper .value { height: 46px; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 10px; background: rgba(0, 0, 0, .25); font-size: 14px; font-weight: 700; }
  .stepper .value small { color: var(--muted); font-size: 10px; font-weight: 400; font-variant-numeric: tabular-nums; }
  .styles { max-height: 260px; overflow: auto; display: flex; flex-direction: column; gap: 4px; padding-right: 4px; }
  .style { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border: 1px solid transparent; border-radius: 8px; background: rgba(255, 255, 255, .03); font-size: 12px; text-align: left; }
  .style:hover { background: rgba(255, 255, 255, .06); }
  .style.on { border-color: var(--gold-soft); background: rgba(242, 193, 92, .1); color: var(--gold); }
  .style .tag { margin-left: auto; color: var(--muted); font-size: 10px; }
  .swatches { display: flex; flex-wrap: wrap; gap: 6px; }
  .swatch { width: 26px; height: 26px; padding: 0; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .1); background: rgba(255, 255, 255, .08); font-size: 9px; display: grid; place-items: center; color: var(--muted); }
  .swatch:hover { border-color: var(--gold-soft); }
  .swatch.on { border-color: var(--gold); box-shadow: 0 0 0 2px rgba(242, 193, 92, .35); color: var(--text); }
  .price-row { display: flex; align-items: baseline; gap: 10px; }
  .price-row .p { color: var(--gold); font-size: 26px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .price-row .tax { color: var(--muted); font-size: 11px; }
  .actions { margin-top: auto; display: flex; gap: 10px; }
  .add { flex: 1; padding: 13px; border: 1px solid var(--gold); border-radius: 10px; background: rgba(242, 193, 92, .14); color: var(--gold); font-weight: 700; font-size: 14px; }
  .add:hover { background: rgba(242, 193, 92, .24); }
  .add:disabled { opacity: .4; cursor: not-allowed; }
  .remove { flex: 0 0 auto; padding: 13px 18px; border: 1px solid var(--line); border-radius: 10px; background: rgba(255, 255, 255, .04); color: var(--muted); font-size: 13px; }
  .remove:hover { border-color: #ff6978; color: #ff6978; }
  .hint { color: var(--muted); font-size: 11px; line-height: 1.5; }
  .empty { margin: auto; color: var(--muted); font-size: 13px; }
  /* Cart footer */
  .cart { border-top: 1px solid var(--gold-soft); padding: 14px 18px; display: flex; flex-direction: column; gap: 10px; background: rgba(0, 0, 0, .25); }
  .cart-head { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .cart-head b { color: var(--accent); }
  .cart-list { max-height: 148px; overflow: auto; display: flex; flex-direction: column; gap: 5px; }
  .cart-empty { color: var(--muted); font-size: 12px; padding: 4px 0; }
  .cart-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: rgba(255, 255, 255, .03); font-size: 12px; }
  .cart-item .ci-price { margin-left: auto; color: var(--gold); font-variant-numeric: tabular-nums; }
  .cart-item .ci-del { width: 22px; height: 22px; border: 1px solid var(--line); border-radius: 6px; background: transparent; color: var(--muted); font-size: 13px; line-height: 1; }
  .cart-item .ci-del:hover { border-color: #ff6978; color: #ff6978; }
  .checkout { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; }
  .checkout .total { font-size: 13px; color: var(--muted); }
  .checkout .total b { color: var(--gold); font-size: 18px; font-variant-numeric: tabular-nums; }
  .checkout button { padding: 12px 20px; border: 1px solid var(--gold); border-radius: 10px; background: rgba(242, 193, 92, .16); color: var(--gold); font-weight: 700; font-size: 14px; }
  .checkout button:hover { background: rgba(242, 193, 92, .28); }
  .checkout button:disabled { opacity: .4; cursor: not-allowed; }
  @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slide { from { transform: translateX(24px); opacity: .4; } to { transform: none; opacity: 1; } }
</style>
</head>
<body>
<div class="veil">
  <main class="shop">
    <header class="head">
      <div class="title"><h1>სალონი</h1><span>თმა, წვერი, წარბები, თვალები</span></div>
      <div class="spacer"></div>
      <div class="money" id="money">$0</div>
      <button class="close" id="close" title="დახურვა (Esc)">×</button>
    </header>
    <div class="body">
      <div class="cats" id="cats"></div>
      <div class="detail" id="detail"><div class="empty">იტვირთება…</div></div>
    </div>
    <div class="cart">
      <div class="cart-head">ცვლილებები · <b id="cartCount">0</b></div>
      <div class="cart-list" id="cartList"><div class="cart-empty">ჯერ არაფერი შეგირჩევია</div></div>
      <div class="checkout">
        <div class="total">სულ: <b id="cartTotal">$0</b></div>
        <button id="checkout" disabled>გადახდა</button>
      </div>
    </div>
  </main>
</div>
<script>
  const RAGE = typeof mp !== 'undefined' && typeof mp.trigger === 'function';
  const trigger = (name, ...args) => { if (RAGE) mp.trigger(name, ...args); };
  const el = (id) => document.getElementById(id);
  const fmt = (n) => '$' + Number(n || 0).toLocaleString('en-US');
  const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);

  let palette = [];  // ['#rrggbb' | null] per GTA hair tint (hair, beard and eyebrow colours)
  let lists = {};    // { hair|beard|eyebrows|eyes: [{ v, name }] } in GTA Online order
  let view = null;   // { money, selected, cats: [...], cart: [...], total, tax }
  let lastDetailKey = null;

  el('close').onclick = () => trigger('barber:ui:close');
  el('checkout').onclick = () => trigger('barber:ui:checkout');
  document.addEventListener('keydown', (event) => {
    if (event.key === 'Escape') { event.preventDefault(); event.stopPropagation(); trigger('barber:ui:close'); }
    else if (view && (event.key === 'ArrowLeft' || event.key === 'ArrowUp')) { event.preventDefault(); trigger('barber:ui:nav', view.selected, -1); }
    else if (view && (event.key === 'ArrowRight' || event.key === 'ArrowDown')) { event.preventDefault(); trigger('barber:ui:nav', view.selected, 1); }
  });

  // Drag anywhere over the ped (outside the panel) to spin the character.
  let dragging = false, lastX = 0;
  document.addEventListener('mousedown', (event) => {
    if (event.target.closest('.shop')) return;
    dragging = true; lastX = event.clientX; document.body.style.cursor = 'ew-resize';
  });
  document.addEventListener('mousemove', (event) => {
    if (!dragging) return;
    const deltaX = event.clientX - lastX; lastX = event.clientX;
    if (deltaX) trigger('barber:ui:rotate', deltaX);
  });
  document.addEventListener('mouseup', () => { dragging = false; document.body.style.cursor = ''; });

  const selectedCat = () => view.cats.find(c => c.key === view.selected);

  function renderCats() {
    const cats = el('cats');
    cats.innerHTML = '';
    view.cats.forEach(category => {
      const button = document.createElement('button');
      button.className = 'cat' + (category.key === view.selected ? ' on' : '');
      button.innerHTML = '<span>' + esc(category.label) + '</span>' + (category.inCart ? '<span class="dot" title="კალათაშია"></span>' : '') +
        '<span class="cat-price">' + fmt(category.price) + '</span>';
      button.onclick = () => trigger('barber:ui:select', category.key);
      cats.appendChild(button);
    });
  }

  // Builds the detail pane once per category; later updates only move the highlights, so a long
  // list keeps its scroll position while you click through it.
  function buildDetail() {
    const detail = el('detail');
    const category = selectedCat();
    lastDetailKey = category.key;
    let picker =
      '<div class="picker"><div class="picker-label">' + esc(category.label) + '</div><div class="stepper">' +
        '<button data-nav="-1">‹</button><div class="value"><span id="valueName"></span><small id="valueIndex"></small></div><button data-nav="1">›</button>' +
      '</div></div>';
    if (category.kind === 'list') {
      picker += '<div class="picker"><div class="picker-label">სია</div><div class="styles" id="itemList">' +
        (lists[category.list] || []).map(item => '<button class="style" data-v="' + item.v + '">' + esc(item.name) + '</button>').join('') +
        '</div></div>';
    } else {
      picker += '<div class="picker"><div class="picker-label">ფერები</div><div class="swatches">' +
        palette.map((rgb, i) => '<button class="swatch" data-v="' + i + '" title="#' + (i + 1) + '"' + (rgb ? ' style="background:' + rgb + '"' : '') + '>' + (rgb ? '' : (i + 1)) + '</button>').join('') +
        '</div></div>';
    }
    detail.innerHTML =
      '<h2>' + esc(category.label) + '</h2>' + picker +
      '<div class="price-row"><span class="p" id="catPrice"></span><span class="tax">მ.შ. გადასახადი</span></div>' +
      '<div class="actions">' +
        '<button class="remove" id="revert">თავდაპირველი</button>' +
      '</div>' +
      '<div class="hint">‹ › / ისრები ან ' + (category.kind === 'list' ? 'სიიდან' : 'ფერზე დაჭერით') + ' — აირჩიე · ' +
        'პერსონაჟის ათრევით ბრუნავს. „თავდაპირველი“ — ამ ნაწილს დააბრუნებს. შემდეგ დააჭირე „გადახდას“.</div>';
    detail.querySelectorAll('[data-nav]').forEach(b => { b.onclick = () => trigger('barber:ui:nav', view.selected, parseInt(b.getAttribute('data-nav'), 10)); });
    detail.querySelectorAll('[data-v]').forEach(b => { b.onclick = () => trigger('barber:ui:pick', view.selected, parseInt(b.getAttribute('data-v'), 10)); });
    el('revert').onclick = () => trigger('barber:ui:revert', view.selected);
  }

  function updateDetail() {
    const category = selectedCat();
    if (!category) { el('detail').innerHTML = '<div class="empty">აირჩიეთ კატეგორია</div>'; lastDetailKey = null; return; }
    if (category.key !== lastDetailKey) buildDetail();
    el('valueName').textContent = category.valueLabel;
    el('valueIndex').textContent = (category.index + 1) + ' / ' + category.count;
    el('detail').querySelectorAll('[data-v]').forEach(b => {
      const on = Number(b.dataset.v) === category.value;
      if (on && !b.classList.contains('on') && category.kind === 'list') b.scrollIntoView({ block: 'nearest' });
      b.classList.toggle('on', on);
    });
    el('catPrice').textContent = fmt(category.price);
  }

  function renderCart() {
    const items = view.cart || [];
    el('cartCount').textContent = items.length;
    el('cartTotal').textContent = fmt(view.total);
    el('checkout').disabled = items.length === 0 || view.total > view.money;
    el('checkout').textContent = items.length ? 'გადახდა ' + fmt(view.total) : 'გადახდა';
    const list = el('cartList');
    if (!items.length) { list.innerHTML = '<div class="cart-empty">კალათა ცარიელია</div>'; return; }
    list.innerHTML = '';
    items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'cart-item';
      row.innerHTML = '<span>' + esc(item.label) + '</span><span class="ci-price">' + fmt(item.price) + '</span><button class="ci-del">×</button>';
      row.querySelector('.ci-del').onclick = () => trigger('barber:ui:cartRemove', item.key);
      list.appendChild(row);
    });
  }

  function render() {
    if (!view) return;
    el('money').textContent = fmt(view.money);
    renderCats();
    updateDetail();
    renderCart();
  }

  // ---- Called by the client ----
  window.setBarberData = function (data) {
    palette = data.palette || [];
    lists = data.lists || {};
    lastDetailKey = null;
    view = data.view;
    render();
  };
  window.updateBarber = function (next) { view = next; render(); };

  if (RAGE) mp.trigger('barber:ui:ready');
  else {
    const mock = [];
    for (let i = 0; i < 64; i++) mock.push(i % 9 === 8 ? null : 'hsl(' + (i * 17 % 360) + ', 40%, ' + (15 + i % 5 * 12) + '%)');
    const names = ['Close Shave', 'Buzzcut', 'Faux Hawk', 'Hipster', 'Side Parting', 'Shorter Cut', 'Biker', 'Ponytail', 'Cornrows', 'Slicked'];
    const beards = [{ v: -1, name: 'არცერთი' }, { v: 0, name: 'Light Stubble' }, { v: 1, name: 'Balbo' }, { v: 2, name: 'Circle Beard' }];
    window.setBarberData({ palette: mock, lists: { hair: names.map((name, v) => ({ v, name })), beard: beards, eyebrows: beards, eyes: beards }, view: {
      money: 5000, selected: 'hair', total: 88, tax: 8,
      cats: [
        { key: 'hair', label: 'ვარცხნილობა', kind: 'list', list: 'hair', price: 88, value: 1, valueLabel: 'Buzzcut', index: 1, count: 10, changed: true, inCart: true },
        { key: 'hairColor', label: 'თმის ფერი', kind: 'color', price: 44, value: 3, valueLabel: '#4', index: 3, count: 64, changed: false, inCart: false },
        { key: 'beard', label: 'წვერი', kind: 'list', list: 'beard', price: 66, value: -1, valueLabel: 'არცერთი', index: 0, count: 4, changed: false, inCart: false }
      ],
      cart: [{ key: 'hair', label: 'ვარცხნილობა: Buzzcut', price: 88 }]
    } });
  }
</script>
</body>
</html>
