<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>სად გაჩნდეთ</title>
<style>
  :root {
    color-scheme: dark;
    --gold: #f2c15c; --blue: #5ac8fa; --green: #8ed17a;
    --text: #f3f0e8; --muted: #aaa79e; --line: rgba(255,255,255,.12);
    font-family: "Noto Sans Georgian", "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { width:100%; height:100%; margin:0; overflow:hidden; }
  body { color: var(--text); user-select:none;
    display:flex; align-items:center; justify-content:center;
    background: radial-gradient(1200px 800px at 50% -10%, rgba(90,200,250,.08), transparent 60%), rgba(0,0,0,.55); }
  .panel { width: min(420px, 92vw); background: linear-gradient(180deg,#101822,#0c0f13);
    border:1px solid rgba(90,200,250,.4); border-radius:14px; box-shadow:0 24px 70px rgba(0,0,0,.6); overflow:hidden;
    animation: lift .18s ease-out; }
  @keyframes lift { from { transform: translateY(8px); opacity:0; } to { transform:none; opacity:1; } }
  .head { padding:18px 20px; border-bottom:1px solid var(--line); }
  .head h1 { margin:0; font-size:18px; font-weight:800; }
  .head p { margin:6px 0 0; color:var(--muted); font-size:12px; }
  .list { padding:14px 18px 20px; display:flex; flex-direction:column; gap:10px; }
  .opt { display:flex; align-items:center; gap:12px; padding:14px 16px; border:1px solid var(--line);
    border-radius:10px; background:rgba(255,255,255,.03); color:var(--text); cursor:pointer; font-size:14px; text-align:left; }
  .opt:hover { border-color:var(--blue); background:rgba(90,200,250,.08); }
  .opt .ic { font-size:20px; }
  .opt .t { font-weight:700; }
  .opt .s { display:block; color:var(--muted); font-size:11px; font-weight:400; margin-top:2px; }
  .opt.home:hover { border-color:var(--green); }
  .opt.last:hover { border-color:var(--gold); }
</style>
</head>
<body>
  <div class="panel">
    <div class="head">
      <h1>სად გაჩნდეთ?</h1>
      <p>აირჩიეთ გაჩენის ადგილი.</p>
    </div>
    <div class="list" id="list"></div>
  </div>
<script>
  const RAGE = typeof mp !== 'undefined' && typeof mp.trigger === 'function';
  const trigger = (name, ...args) => { if (RAGE) mp.trigger(name, ...args); };
  const $ = (id) => document.getElementById(id);

  function choose(choice) { trigger('auth:spawnChoose', choice); }

  function addOption(cls, icon, title, sub, choice) {
    const b = document.createElement('button');
    b.className = 'opt ' + cls;
    b.innerHTML = '<span class="ic">' + icon + '</span><span><span class="t">' + title + '</span>'
      + (sub ? '<span class="s">' + sub + '</span>' : '') + '</span>';
    b.addEventListener('click', () => choose(choice));
    $('list').appendChild(b);
  }

  window.spawnInit = function (payloadJson) {
    const data = JSON.parse(payloadJson || '{}');
    $('list').innerHTML = '';
    if (data.home) addOption('home', '🏠', 'სახლი', 'თქვენი საცხოვრებელი', 'home');
    (data.factions || []).forEach((f) => addOption('faction', '🏢', f.label, 'სამსახური', 'faction:' + f.key));
    addOption('last', '📍', 'ბოლო ადგილი', 'სადაც გამოხვედით', 'last');
  };

  // browser preview fallback
  if (!RAGE) window.spawnInit(JSON.stringify({ home: true, factions: [{ key: 'police', label: 'პოლიცია' }] }));
</script>
</body>
</html>
